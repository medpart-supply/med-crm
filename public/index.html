/* =========== ВКЛАДКА: ТЕРМІНИ ВИКОНАННЯ =========== */
const WD = ["Понеділок","Вівторок","Середа","Четвер","П'ятниця","Субота","Неділя"];
const WD2 = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const MON = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const PERIOD = {
  daily:     "Щоденно",
  weekly:    "Щотижня",
  monthly:   "Щомісяця",
  quarterly: "Щоквартально",
  yearly:    "Щороку"
};
const pad2 = n => String(n).padStart(2,"0");
const ymd  = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());

/* ключ поточного періоду — за ним видно, чи вже здано цього разу */
function periodKey(t, d){
  const y = d.getFullYear();
  switch(t.period){
    case "daily":     return ymd(d);
    case "weekly":    { const m = mondayOf(d); return "W" + ymd(m); }
    case "monthly":   return y + "-" + pad2(d.getMonth()+1);
    case "quarterly": return y + "-Q" + (Math.floor(d.getMonth()/3)+1);
    default:          return String(y);
  }
}
function mondayOf(d){
  const m = new Date(d); const wd = (m.getDay() + 6) % 7;   // 0 = понеділок
  m.setDate(m.getDate() - wd); m.setHours(0,0,0,0); return m;
}
const lastDay = (y, m) => new Date(y, m+1, 0).getDate();

/* кінцевий строк у поточному періоді */
function dueDate(t, from){
  const d = from || today(), y = d.getFullYear(), m = d.getMonth();
  switch(t.period){
    case "daily":  return new Date(y, m, d.getDate());
    case "weekly": { const mo = mondayOf(d); mo.setDate(mo.getDate() + (t.day || 0)); return mo; }
    case "monthly":return new Date(y, m, Math.min(t.day || 1, lastDay(y, m)));
    case "quarterly": { const qm = Math.floor(m/3)*3 + (t.qm || 0); return new Date(y, qm, Math.min(t.day || 1, lastDay(y, qm))); }
    default: { const mm = (t.month || 1) - 1; return new Date(y, mm, Math.min(t.day || 1, lastDay(y, mm))); }
  }
}
const taskDone = (t, d) => (S.taskLog||[]).find(x => x.taskId === t.id && x.key === periodKey(t, d || today()));

function taskState(t){
  const now = today(), due = dueDate(t, now), done = taskDone(t, now);
  const days = Math.round((due - now) / 86400000);
  if(done) return {k:"done", label:"Здано " + dtstr(done.at), cls:"ok", due, days, done};
  if(days < 0)  return {k:"overdue", label:"Прострочено на " + Math.abs(days) + " дн.", cls:"crit", due, days};
  if(days === 0) return {k:"today", label:"Строк сьогодні", cls:"warn", due, days};
  if(days <= 2)  return {k:"soon", label:"Залишилось " + days + " дн.", cls:"warn", due, days};
  return {k:"ok", label:"Залишилось " + days + " дн.", cls:"", due, days};
}
function taskWhen(t){
  switch(t.period){
    case "daily":     return "щоденно";
    case "weekly":    return "щотижня, " + (WD[t.day||0]||"").toLowerCase();
    case "monthly":   return "щомісяця, до " + (t.day||1) + " числа";
    case "quarterly": return "щоквартально, до " + (t.day||1) + " числа " +
                        (t.qm ? (t.qm === 1 ? "другого" : "третього") + " місяця кварталу" : "першого місяця кварталу");
    default:          return "щороку, до " + (t.day||1) + " " + (MON[(t.month||1)-1] || "");
  }
}
const RANK = {overdue:0, today:1, soon:2, ok:3, done:4};

function viewTerms(){
  const canEdit = ME.admin;
  const all = (S.tasks||[]).filter(t => t.active !== false);
  const mine = all.filter(t => t.loc === ME.loc);
  const list = (sub.terms === "all" || !mine.length ? all : mine)
    .map(t => ({t, st: taskState(t)}))
    .sort((a,b) => RANK[a.st.k] - RANK[b.st.k] || a.st.due - b.st.due);

  if(canEdit) act("Додати донесення", ()=>taskModal(null)).classList.add("primary");

  const cnt = k => all.filter(t => taskState(t).k === k).length;
  const v = $("#view");
  v.insertAdjacentHTML("beforeend", `
    <div class="grid g4" style="margin-bottom:14px">
      <div class="stat ${cnt("overdue")?"crit":"ok"}"><div class="eyebrow">Прострочено</div>
        <div class="v">${cnt("overdue")}</div><div class="n">строк уже минув</div></div>
      <div class="stat ${cnt("today")?"warn":""}"><div class="eyebrow">Сьогодні</div>
        <div class="v">${cnt("today")}</div><div class="n">подати до кінця дня</div></div>
      <div class="stat"><div class="eyebrow">Найближчі дні</div>
        <div class="v">${cnt("soon")}</div><div class="n">строк за 1–2 дні</div></div>
      <div class="stat ok"><div class="eyebrow">Здано в цьому періоді</div>
        <div class="v">${cnt("done")}</div><div class="n">із ${all.length} донесень</div></div>
    </div>
    <div class="row" style="margin-bottom:14px"><div class="seg">
      <button data-ts="mine" class="${sub.terms==="mine"?"on":""}">Мого підрозділу (${mine.length})</button>
      <button data-ts="all" class="${sub.terms==="all"?"on":""}">Усі підрозділи (${all.length})</button>
    </div></div>
    <div id="tbody"></div>`);
  v.querySelectorAll("[data-ts]").forEach(b=>b.onclick=()=>{sub.terms=b.dataset.ts; render();});

  $("#tbody").innerHTML = list.length ? `<div class="card">
      <header><h3>Періодичні донесення</h3><span class="spacer"></span>
        <span class="eyebrow">${list.length} позицій</span></header>
      <div class="tw" style="max-height:none"><table><thead><tr>
        <th>Донесення</th><th>Періодичність</th><th>Строк</th><th>Відповідальний</th><th>Стан</th><th></th></tr></thead><tbody>
      ${list.map(({t, st})=>`<tr>
        <td class="name">${esc(t.title)}
          ${t.doc? `<div class="sub2">${esc(t.doc)}</div>`:""}
          ${t.note? `<div class="sub2" style="color:var(--warn)">${esc(t.note)}</div>`:""}</td>
        <td class="sub2">${esc(taskWhen(t))}</td>
        <td class="mono">${dstr(st.due)}</td>
        <td><span class="tag">${LOCS[t.loc]?LOCS[t.loc].short:"—"}</span> <span class="sub2">${LOCS[t.loc]?LOCS[t.loc].name:""}</span></td>
        <td><span class="tag ${st.cls}"><span class="dot"></span>${esc(st.label)}</span>
          ${st.done? `<div class="sub2">${esc(st.done.user||"")}</div>`:""}</td>
        <td style="white-space:nowrap;text-align:right">
          ${(t.loc===ME.loc || canEdit)
            ? (st.done? `<button class="btn sm" data-undo="${t.id}">Скасувати</button>`
                      : `<button class="btn sm primary" data-done="${t.id}">Виконано</button>`) : ""}
          ${canEdit? `<button class="btn sm" data-tedit="${t.id}">Змінити</button>
                      <button class="btn sm danger" data-tdel="${t.id}">Вилучити</button>`:""}
        </td></tr>`).join("")}
    </tbody></table></div></div>`
    : `<div class="card"><div class="empty"><strong>Донесень не внесено</strong>${
        canEdit? "Натисніть «Додати донесення», щоб внести перелік із розпоряджень." : "Перелік веде завідувач аптеки."}</div></div>`;

  $("#tbody").querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{
    const t = S.tasks.find(x=>x.id===b.dataset.done);
    (S.taskLog = S.taskLog||[]).push({id:uid("td"), taskId:t.id, key:periodKey(t, today()),
      at:Date.now(), user:ME.name, loc:ME.loc});
    log("Строки", `Подано донесення «${t.title}» (${taskWhen(t)}) — ${LOCS[t.loc].name}`);
    toast("Позначено як виконане"); render();
  });
  $("#tbody").querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{
    const t = S.tasks.find(x=>x.id===b.dataset.undo), d = taskDone(t);
    if(!d) return;
    S.taskLog = S.taskLog.filter(x=>x.id!==d.id);
    log("Строки", `Скасовано відмітку про подання «${t.title}»`);
    toast("Відмітку знято"); render();
  });
  $("#tbody").querySelectorAll("[data-tedit]").forEach(b=>b.onclick=()=>taskModal(b.dataset.tedit));
  $("#tbody").querySelectorAll("[data-tdel]").forEach(b=>b.onclick=()=>{
    const t = S.tasks.find(x=>x.id===b.dataset.tdel);
    modal("Вилучення донесення", `<p style="margin:0">Вилучити «${esc(t.title)}» з переліку? Відмітки про попередні подання залишаться в журналі.</p>`,
      [{t:"Скасувати", f:close},{t:"Вилучити", cls:"danger", f:()=>{
        S.tasks = S.tasks.filter(x=>x.id!==t.id);
        log("Строки", `Вилучено донесення «${t.title}»`);
        close(); toast("Вилучено"); render();
      }}]);
  });
}

function taskModal(id){
  if(!ME.admin) return;
  const t = id ? S.tasks.find(x=>x.id===id) : null;
  const p = t ? t.period : "monthly";
  modal(t ? "Зміна донесення" : "Нове періодичне донесення", `
    <div class="field" style="margin-bottom:12px"><label>Що подається</label>
      <input type="text" id="t-title" value="${t?esc(t.title):""}" placeholder="Інформація про військовослужбовців, які перебувають на лікуванні"></div>
    <div class="grid g2">
      <div class="field"><label>Відповідальний підрозділ</label>
        <select id="t-loc">${ORDER.map(l=>`<option value="${l}" ${t&&t.loc===l?"selected":""}>${LOCS[l].name}</option>`).join("")}</select></div>
      <div class="field"><label>Періодичність</label>
        <select id="t-period">${Object.entries(PERIOD).map(([k,n])=>`<option value="${k}" ${p===k?"selected":""}>${n}</option>`).join("")}</select></div>
    </div>
    <div id="t-when" style="margin-top:10px"></div>
    <div class="field" style="margin-top:12px"><label>Підстава</label>
      <input type="text" id="t-doc" value="${t?esc(t.doc||""):""}" placeholder="Розпорядження від 08.01.2025 № 33"></div>
    <div class="field" style="margin-top:12px"><label>Примітка</label>
      <input type="text" id="t-note" value="${t?esc(t.note||""):""}" placeholder="Кому подається, у якій формі, що уточнити"></div>`,
    [{t:"Скасувати", f:close},{t:t?"Зберегти":"Додати", cls:"primary", f:save2}]);

  const per = document.getElementById("t-period");
  const drawWhen = ()=>{
    const w = document.getElementById("t-when"), k = per.value;
    if(k === "daily"){ w.innerHTML = `<p class="sub2" style="margin:0">Строк — кінець кожного дня.</p>`; return; }
    if(k === "weekly"){
      w.innerHTML = `<div class="field"><label>День тижня</label><select id="t-day">${
        WD.map((n,i)=>`<option value="${i}" ${t&&t.period==="weekly"&&t.day===i?"selected":""}>${n}</option>`).join("")}</select></div>`;
      return;
    }
    if(k === "yearly"){
      w.innerHTML = `<div class="grid g2">
        <div class="field"><label>Місяць</label><select id="t-month">${
          MON.map((n,i)=>`<option value="${i+1}" ${t&&t.month===i+1?"selected":""}>${n[0].toUpperCase()+n.slice(1)}</option>`).join("")}</select></div>
        <div class="field"><label>Число</label><input type="number" id="t-day" min="1" max="31" value="${t&&t.day?t.day:1}"></div></div>`;
      return;
    }
    w.innerHTML = `<div class="grid g2">
      <div class="field"><label>До якого числа</label><input type="number" id="t-day" min="1" max="31" value="${t&&t.day?t.day:5}"></div>
      ${k==="quarterly"? `<div class="field"><label>Місяць кварталу</label><select id="t-qm">
          <option value="0" ${t&&!t.qm?"selected":""}>перший</option>
          <option value="1" ${t&&t.qm===1?"selected":""}>другий</option>
          <option value="2" ${t&&t.qm===2?"selected":""}>третій</option></select></div>`:""}
    </div>`;
  };
  drawWhen();
  per.onchange = drawWhen;

  function save2(){
    const title = document.getElementById("t-title").value.trim();
    if(!title) return toast("Вкажіть, що саме подається", true);
    const k = per.value;
    const el = id2 => document.getElementById(id2);
    const data = {
      title, loc: document.getElementById("t-loc").value, period: k,
      day:   el("t-day")   ? Math.max(1, Math.min(31, parseInt(el("t-day").value,10) || 1)) : null,
      qm:    el("t-qm")    ? parseInt(el("t-qm").value,10) : 0,
      month: el("t-month") ? parseInt(el("t-month").value,10) : null,
      doc:   document.getElementById("t-doc").value.trim(),
      note:  document.getElementById("t-note").value.trim(),
      active: true
    };
    if(t){ Object.assign(t, data); log("Строки", `Змінено донесення «${title}» — ${taskWhen(t)}, ${LOCS[t.loc].name}`); }
    else {
      const nt = Object.assign({id:uid("t")}, data);
      (S.tasks = S.tasks||[]).push(nt);
      log("Строки", `Додано донесення «${title}» — ${taskWhen(nt)}, ${LOCS[nt.loc].name}`);
    }
    close(); toast(t?"Зміни збережено":"Донесення додано"); render();
  }
}

/* =========== ВКЛАДКА 5: ІСТОРІЯ =========== */
function viewHist(){
  if(!ME.admin){
    $("#view").innerHTML = `<div class="card"><div class="empty">
      <strong>Журнал операцій доступний лише адміністратору</strong>
      Повний перелік маніпуляцій у системі веде завідувач аптеки.</div></div>`;
    return;
  }
  act("Експорт журналу", ()=>{
    const aoa = [["Дата і час","Підрозділ","Користувач","Тип операції","Опис"]];
    S.log.forEach(l=>aoa.push([dtstr(l.ts), LOCS[l.actor]?LOCS[l.actor].name:l.actor, l.user||"—", l.type, l.text]));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Журнал");
    XLSX.writeFile(wb, "zhurnal-" + new Date().toISOString().slice(0,10) + ".xlsx");
    toast("Журнал вивантажено");
  });
  if(ME.admin) act("Очистити базу", ()=>{
    modal("Очищення бази", `<p>Буде видалено всі залишки, заявки, каталог і журнал. Дію не можна скасувати.</p>`,
      [{t:"Скасувати", f:close},{t:"Видалити все", cls:"danger", f:async ()=>{
        const keep = S.users; S = blank(); S.users = keep; S.role = ME.loc;
        log("Система","Базу очищено (облікові записи збережено)"); close(); toast("Базу очищено"); render();
      }}]);
  });

  const types = ["all", ...new Set(S.log.map(l=>l.type))];
  const TCOL = {"Надходження":"ok","Видача":"acc","Заявка":"","Відмова":"crit","Списання":"warn","Рецепт":"","Виправлення":"warn","Майно":"acc","Строки":"ok","Доступ":"","Система":""};

  $("#view").innerHTML = `<div class="row" style="margin-bottom:14px">
      <div class="field" style="width:220px"><label>Тип операції</label>
        <select id="ht">${types.map(t=>`<option value="${esc(t)}" ${flt.histType===t?"selected":""}>${t==="all"?"Усі операції":esc(t)}</option>`).join("")}</select></div>
      <div class="field" style="flex:1;max-width:420px"><label>Пошук у журналі</label>
        <input type="text" id="hq" value="${esc(flt.hist)}" placeholder="Назва препарату, номер заявки, накладна"></div>
    </div><div id="histCard"></div>`;
  $("#ht").onchange = e=>{flt.histType=e.target.value; drawLog(); save();};
  $("#hq").oninput  = e=>{flt.hist=e.target.value; drawLog();};
  drawLog();

  function drawLog(){
    const q = flt.hist.trim().toLowerCase();
    const list = S.log.filter(l=>
      (flt.histType==="all" || l.type===flt.histType) &&
      (!q || l.text.toLowerCase().includes(q) || l.type.toLowerCase().includes(q))
    );
    $("#histCard").innerHTML = `<div class="card"><header><h3>Журнал маніпуляцій</h3><span class="spacer"></span>
      <span class="eyebrow">${list.length} із ${S.log.length} записів</span></header>
      ${list.length? `<div class="tw" style="max-height:none"><table><thead><tr><th style="width:140px">Дата і час</th><th style="width:150px">Підрозділ</th><th style="width:150px">Користувач</th><th style="width:130px">Операція</th><th>Опис</th></tr></thead><tbody>
        ${list.map(l=>`<tr><td class="mono sub2">${dtstr(l.ts)}</td>
          <td>${LOCS[l.actor]?LOCS[l.actor].name:esc(l.actor)}</td>
          <td class="sub2">${esc(l.user||"—")}</td>
          <td><span class="tag ${TCOL[l.type]||""}"><span class="dot"></span>${esc(l.type)}</span></td>
          <td>${esc(l.text)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty"><strong>Записів не знайдено</strong>Змініть тип операції або пошуковий запит.</div>`}
    </div>`;
  }
}

/* ---------- модалка ---------- */
function modal(title, body, btns, opts){
  const noclose = opts && opts.noclose;
  $("#modal-root").innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">
    <header><h3>${title}</h3>${noclose?"":`<button class="x" aria-label="Закрити">×</button>`}</header>
    <div class="body">${body}</div>
    <footer>${(btns||[]).map((b,i)=>`<button class="btn ${b.cls||""}" data-k="${i}">${b.t}</button>`).join("")}</footer>
  </div></div>`;
  if(!noclose){
    $("#modal-root").querySelector(".x").onclick = close;
    $("#modal-root").querySelector(".scrim").onclick = e=>{ if(e.target.classList.contains("scrim")) close(); };
    document.addEventListener("keydown", escClose);
  }
  (btns||[]).forEach((b,i)=>{ $(`#modal-root [data-k="${i}"]`).onclick = b.f; });
}
function close(){ $("#modal-root").innerHTML=""; document.removeEventListener("keydown", escClose); }
function escClose(e){ if(e.key==="Escape") close(); }

/* ---------- старт ---------- */
(async ()=>{ await load(); render(); })();
</script>
