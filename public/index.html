/* ---------- створення заявки підрозділом ---------- */
function newReqModal(){
  const src = LOCS[S.role].supplier;
  const rows = stockRows(src);
  if(!rows.length){ return modal("Створення заявки", `<div class="empty"><strong>У ${LOCS[src].name} немає залишків</strong>Замовляти поки нічого.</div>`, [{t:"Закрити", f:close}]); }
  let lines = [];
  modal(`Заявка до: ${LOCS[src].name}`, `
    <div class="field" style="margin-bottom:8px">
      <label>Пошук препарату <span class="eyebrow" id="req-find-cnt" style="margin-left:6px"></span></label>
      <input type="text" id="req-find" placeholder="назва або номенклатурний номер"></div>
    <div class="row" style="margin-bottom:12px">
      <div class="field" style="flex:1;min-width:260px"><label>Препарат (доступно в ${LOCS[src].name})</label>
        <select id="pick"></select></div>
      <div class="field" style="width:130px"><label>Кількість</label><input type="number" id="pq" step="any" min="0" value="1"></div>
      <button class="btn" id="add">Додати в заявку</button>
    </div>
    <div id="lines"></div>
    <div class="field" style="margin-top:12px"><label>Примітка</label><input type="text" id="note" placeholder="Наприклад: поповнення укладки на добове чергування"></div>`,
    [{t:"Скасувати", f:close},{t:"Подати заявку", cls:"primary", f:submit}]);

  attachPicker("req-find", "pick", rows);

  const draw = ()=>{
    $("#lines").innerHTML = lines.length ? `<table class="lines"><thead><tr><th>Препарат</th><th class="num">Кількість</th><th class="num">Доступно</th><th></th></tr></thead><tbody>
      ${lines.map((l,i)=>{const it=item(l.itemId); const has=avail(src,l.itemId); return `<tr>
        <td>${esc(it.name)}</td><td class="num">${qty(l.want)} ${esc(it.unit)}</td>
        <td class="num" style="color:${has>=l.want?"var(--ok)":"var(--warn)"}">${qty(has)}</td>
        <td style="text-align:right"><button class="btn sm danger" data-del="${i}">Прибрати</button></td></tr>`}).join("")}
      </tbody></table>` : `<div class="empty" style="padding:20px"><strong>Заявка порожня</strong>Оберіть препарат і додайте його до заявки.</div>`;
    $("#lines").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{lines.splice(+b.dataset.del,1);draw()});
  };
  draw();
  $("#add").onclick = ()=>{
    const id = $("#pick").value, q = parseFloat($("#pq").value)||0;
    if(!id) return toast("Оберіть препарат зі списку", true);
    if(q<=0) return toast("Вкажіть кількість більшу за нуль", true);
    const ex = lines.find(l=>l.itemId===id);
    if(ex) ex.want += q; else lines.push({itemId:id, want:q, got:0});
    draw();
  };
  function submit(){
    if(!lines.length) return toast("Додайте хоча б один препарат", true);
    const r = {id:uid("r"), no:"З-"+String(++S.req).padStart(4,"0"), from:S.role, to:src, status:"pending",
      created:Date.now(), by2:ME.name, note:$("#note").value.trim(), lines:lines.map(l=>({itemId:l.itemId, want:l.want, got:0}))};
    S.requests.push(r);
    log("Заявка", `${LOCS[S.role].name} подав заявку ${r.no} до ${LOCS[src].name} на ${lines.length} позицій`, {req:r.no});
    close(); toast("Заявку " + r.no + " подано"); render();
  }
}

/* ---------- видача за заявкою ---------- */
function issueModal(id){
  const r = S.requests.find(x=>x.id===id);
  const src = r.to;
  modal(`Видача за заявкою ${r.no}`, `
    <div class="sub2" style="margin-bottom:12px">${LOCS[r.from].name} ← ${LOCS[r.to].name} · подано ${dtstr(r.created)}${r.note?" · "+esc(r.note):""}</div>
    <table class="lines"><thead><tr><th>Препарат</th><th class="num">Замовлено</th><th class="num">Є</th><th class="num">Видати</th><th>Партії (FEFO)</th></tr></thead><tbody>
    ${r.lines.map((l,i)=>{const it=item(l.itemId); const has=avail(src,l.itemId); const give=Math.min(l.want,has);
      const bs = atLoc(src).filter(b=>b.itemId===l.itemId).sort((a,b)=>(dparse(a.expiry)||9e15)-(dparse(b.expiry)||9e15)).slice(0,2);
      return `<tr><td>${esc(it.name)}<div class="sub2 mono">${esc(it.nomen||"—")}</div></td>
        <td class="num">${qty(l.want)} ${esc(it.unit)}</td>
        <td class="num" style="color:${has>=l.want?"var(--ok)":"var(--warn)"}">${qty(has)}</td>
        <td class="num"><input type="number" class="mono" data-i="${i}" step="any" min="0" max="${has}" value="${give}" style="width:100px;text-align:right"></td>
        <td class="sub2 mono">${bs.map(b=>dstr(b.expiry)).join(", ")||"—"}</td></tr>`}).join("")}
    </tbody></table>
    <p class="sub2" style="margin-top:12px">Списання відбувається за принципом FEFO — першими йдуть партії з найближчим терміном придатності.</p>`,
    [{t:"Скасувати", f:close},{t:"Провести видачу", cls:"primary", f:go}]);

  function go(){
    const give = [...document.querySelectorAll("[data-i]")].map(i=>parseFloat(i.value)||0);
    if(give.every(g=>g<=0)) return toast("Вкажіть кількість хоча б для однієї позиції", true);
    let full = true, parts = [];
    r.lines.forEach((l,i)=>{
      const want = Math.min(give[i], avail(src,l.itemId));
      if(want>0){
        const {taken} = takeFEFO(src, l.itemId, want);
        taken.forEach(t=>addBatch(r.from, l.itemId, t.qty, t.price, t.expiry, t.src));
        l.got = want;
      }
      if((l.got||0) + 0.0001 < l.want) full = false;
      if(l.got>0) parts.push(`${item(l.itemId).name} — ${qty(l.got)} ${item(l.itemId).unit}`);
    });
    r.status = full ? "issued" : "partial";
    r.closed = Date.now(); r.by = S.role;
    log("Видача", `${LOCS[src].name} → ${LOCS[r.from].name} за заявкою ${r.no}: ${parts.join("; ") || "нічого не видано"}`, {req:r.no});
    close(); toast(full? "Заявку виконано повністю" : "Заявку виконано частково"); render();
  }
}

  const r = S.requests.find(x=>x.id===id);

/* =========== ВКЛАДКА 5: ІСТОРІЯ =========== */
function viewHist(){
  if(!ME.admin){
    $("#view").innerHTML = `<div class="card"><div class="empty">
      <strong>Журнал операцій доступний лише адміністратору</strong>
      Повний перелік маніпуляцій у системі веде завідувач аптеки.</div></div>`;
    return;
  }
  act("Експорт журналу", ()=>{
    const aoa = [["Дата і час","Підрозділ","Користувач","Тип операції","Опис"]];
    S.log.forEach(l=>aoa.push([dtstr(l.ts), LOCS[l.actor]?LOCS[l.actor].name:l.actor, l.user||"—", l.type, l.text]));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Журнал");
    XLSX.writeFile(wb, "zhurnal-" + new Date().toISOString().slice(0,10) + ".xlsx");
    toast("Журнал вивантажено");
  });
  if(ME.admin) act("Очистити базу", ()=>{
    modal("Очищення бази", `<p>Буде видалено всі залишки, заявки, каталог і журнал. Дію не можна скасувати.</p>`,
      [{t:"Скасувати", f:close},{t:"Видалити все", cls:"danger", f:async ()=>{
        const keep = S.users; S = blank(); S.users = keep; S.role = ME.loc;
        log("Система","Базу очищено (облікові записи збережено)"); close(); toast("Базу очищено"); render();
      }}]);
  });

  const types = ["all", ...new Set(S.log.map(l=>l.type))];
  const TCOL = {"Надходження":"ok","Видача":"acc","Заявка":"","Відмова":"crit","Списання":"warn","Рецепт":"","Виправлення":"warn","Майно":"acc","Доступ":"","Система":""};

  $("#view").innerHTML = `<div class="row" style="margin-bottom:14px">
      <div class="field" style="width:220px"><label>Тип операції</label>
        <select id="ht">${types.map(t=>`<option value="${esc(t)}" ${flt.histType===t?"selected":""}>${t==="all"?"Усі операції":esc(t)}</option>`).join("")}</select></div>
      <div class="field" style="flex:1;max-width:420px"><label>Пошук у журналі</label>
        <input type="text" id="hq" value="${esc(flt.hist)}" placeholder="Назва препарату, номер заявки, накладна"></div>
    </div><div id="histCard"></div>`;
  $("#ht").onchange = e=>{flt.histType=e.target.value; drawLog(); save();};
  $("#hq").oninput  = e=>{flt.hist=e.target.value; drawLog();};
  drawLog();

  function drawLog(){
    const q = flt.hist.trim().toLowerCase();
    const list = S.log.filter(l=>
      (flt.histType==="all" || l.type===flt.histType) &&
      (!q || l.text.toLowerCase().includes(q) || l.type.toLowerCase().includes(q))
    );
    $("#histCard").innerHTML = `<div class="card"><header><h3>Журнал маніпуляцій</h3><span class="spacer"></span>
      <span class="eyebrow">${list.length} із ${S.log.length} записів</span></header>
      ${list.length? `<div class="tw" style="max-height:none"><table><thead><tr><th style="width:140px">Дата і час</th><th style="width:150px">Підрозділ</th><th style="width:150px">Користувач</th><th style="width:130px">Операція</th><th>Опис</th></tr></thead><tbody>
        ${list.map(l=>`<tr><td class="mono sub2">${dtstr(l.ts)}</td>
          <td>${LOCS[l.actor]?LOCS[l.actor].name:esc(l.actor)}</td>
          <td class="sub2">${esc(l.user||"—")}</td>
          <td><span class="tag ${TCOL[l.type]||""}"><span class="dot"></span>${esc(l.type)}</span></td>
          <td>${esc(l.text)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty"><strong>Записів не знайдено</strong>Змініть тип операції або пошуковий запит.</div>`}
    </div>`;
  }
}

/* ---------- модалка ---------- */
function modal(title, body, btns, opts){
  const noclose = opts && opts.noclose;
  $("#modal-root").innerHTML = `<div class="scrim"><div class="modal" role="dialog" aria-modal="true">
    <header><h3>${title}</h3>${noclose?"":`<button class="x" aria-label="Закрити">×</button>`}</header>
    <div class="body">${body}</div>
    <footer>${(btns||[]).map((b,i)=>`<button class="btn ${b.cls||""}" data-k="${i}">${b.t}</button>`).join("")}</footer>
  </div></div>`;
  if(!noclose){
    $("#modal-root").querySelector(".x").onclick = close;
    $("#modal-root").querySelector(".scrim").onclick = e=>{ if(e.target.classList.contains("scrim")) close(); };
    document.addEventListener("keydown", escClose);
  }
  (btns||[]).forEach((b,i)=>{ $(`#modal-root [data-k="${i}"]`).onclick = b.f; });
}
function close(){ $("#modal-root").innerHTML=""; document.removeEventListener("keydown", escClose); }
function escClose(e){ if(e.key==="Escape") close(); }

/* ---------- старт ---------- */
(async ()=>{ await load(); render(); })();
</script>
