<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Медична частина КІ НГУ — облік медикаментів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#E4E8DF;
  --surface:#FBFBF7;
  --surface-2:#F2F4EE;
  --rail:#16211C;
  --rail-2:#22322A;
  --rail-3:#2E4137;
  --ink:#15201C;
  --muted:#65726B;
  --faint:#909B94;
  --line:#D3DACC;
  --line-strong:#B9C3B2;
  --accent:#14624F;
  --accent-soft:#DCEAE3;
  --ok:#2E6F4E;
  --warn:#9A6B0E;
  --warn-soft:#F6EBD2;
  --crit:#9E2430;
  --crit-soft:#F6DEDF;
  --radius:3px;
  --shadow:0 1px 0 rgba(21,32,28,.05), 0 8px 24px -18px rgba(21,32,28,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#DCE5DE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mark{display:flex;align-items:center;gap:9px}
.brand .cross{width:22px;height:22px;position:relative;flex:0 0 auto}
.brand .cross:before,.brand .cross:after{content:"";position:absolute;background:#7FBFA4}
.brand .cross:before{left:9px;top:0;width:4px;height:22px}
.brand .cross:after{top:9px;left:0;height:4px;width:22px}
.brand h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:16px;letter-spacing:.01em;color:#F2F7F3}
.brand .org{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.22em;color:#7FBFA4;margin-bottom:9px}
.brand p{margin:6px 0 0;font-size:11px;color:#8B9C92;letter-spacing:.02em}

.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{
  display:flex;align-items:flex-start;gap:10px;line-height:1.35;width:100%;text-align:left;
  background:none;border:0;color:#B8C7BE;padding:10px 11px;border-radius:var(--radius);cursor:pointer;
  font-size:13.5px;letter-spacing:.01em;
}
.nav button:hover{background:var(--rail-2);color:#EAF2EC}
.nav button.on{background:var(--rail-3);color:#fff;font-weight:500}
.nav button .idx{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#6E8578;width:14px;flex:0 0 14px;padding-top:3px}
.nav button.on .idx{color:#8FD3B4}
.nav button .badge{margin-left:auto;align-self:center;background:#B4442F;color:#fff;font-size:10.5px;font-family:"IBM Plex Mono",monospace;padding:1px 6px;border-radius:20px}

.role-box{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.14)}
.role-box .eyebrow{color:#6E8578;margin-bottom:7px}
.role-box select{
  width:100%;background:var(--rail-2);border:1px solid rgba(255,255,255,.14);color:#EAF2EC;
  padding:8px 9px;border-radius:var(--radius);cursor:pointer
}
.role-box .hint{margin:9px 0 0;font-size:11px;color:#8B9C92;line-height:1.4}

.work{min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:16px 26px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20
}
.topbar h2{font-family:"IBM Plex Serif",Georgia,serif;font-size:22px;letter-spacing:-.01em}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.topbar .spacer{flex:1}
.view{padding:22px 26px 60px;max-width:1400px}

/* ---------- primitives ---------- */
.btn{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:8px 13px;cursor:pointer;font-size:13px;transition:.14s;white-space:nowrap
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0F5142;color:#fff}
.btn.danger{color:var(--crit);border-color:#DFC0C3}
.btn.danger:hover{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card > header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.card > header h3{font-size:14px}
.card > header .spacer{flex:1}
.pad{padding:16px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1fr 1fr}
.split{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.stat .v{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.stat .n{font-size:11.5px;color:var(--muted);margin-top:5px}
.stat.warn{border-left:3px solid var(--warn)}
.stat.crit{border-left:3px solid var(--crit)}
.stat.acc{border-left:3px solid var(--accent)}
.stat.ok{border-left:3px solid var(--ok)}

table{width:100%;border-collapse:collapse}
th{
  text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:500;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);
  position:sticky;top:0
}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:#F5F8F2}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:560px}
.name{font-weight:500}
.sub2{font-size:11.5px;color:var(--muted)}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface-2);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:#BCD8C6;background:#E7F2EA}
.tag.warn{color:var(--warn);border-color:#E4CE9E;background:var(--warn-soft)}
.tag.crit{color:var(--crit);border-color:#E0B6BA;background:var(--crit-soft)}
.tag.acc{color:var(--accent);border-color:#B4D3C8;background:var(--accent-soft)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{
  background:#fff;border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 9px;width:100%
}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:14.5px;margin-bottom:5px;font-weight:600}

.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}

/* ---------- signature: shelf-life ribbon ---------- */
.ribbon{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ribbon .head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ribbon .legend{margin-left:auto;display:flex;gap:12px;font-size:11px;color:var(--muted);align-items:center}
.ribbon .legend i{width:9px;height:9px;display:inline-block;margin-right:4px;border-radius:1px}
.ribbon svg{display:block;width:100%;height:auto;background:linear-gradient(90deg,#FBEEEE 0 8.5%, #FBFBF7 8.5% 100%)}
.ribbon .readout{padding:9px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);min-height:38px;display:flex;align-items:center;gap:9px}
.tick{cursor:pointer}
.tick rect{transition:.12s}
.tick:hover rect{stroke:var(--ink);stroke-width:1.2}

/* ---------- календар донесень ---------- */
.tdaily{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.tstrip{display:grid;grid-template-columns:repeat(14,minmax(64px,1fr));gap:1px;background:var(--line);overflow-x:auto}
.tday{background:var(--surface);padding:8px 6px 10px;min-height:96px;display:flex;flex-direction:column;gap:4px}
.tday.off{background:#F5F6F2}
.tday.now{background:var(--accent-soft);box-shadow:inset 0 2px 0 var(--accent)}
.tdate{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);letter-spacing:.06em;margin-bottom:2px}
.tdate b{font-size:14px;color:var(--ink);font-weight:600;letter-spacing:0}
.tchip{font-size:10.5px;line-height:1.3;padding:4px 6px;border-radius:2px;border-left:3px solid var(--faint);
  background:var(--surface-2);color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;cursor:default}
.tchip.wait{border-left-color:var(--accent)}
.tchip.today{border-left-color:#B08A1E;background:var(--warn-soft)}
.tchip.done{border-left-color:#3E7F63;background:#E7F2EA;color:var(--muted)}
.tchip.over{border-left-color:#9E2430;background:#fff;color:var(--crit)}
.tdaily .tchip{max-width:260px;-webkit-line-clamp:1}
@media (max-width:900px){ .tstrip{grid-template-columns:repeat(14,132px)} }

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,30,26,.5);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:100;overflow:auto}
.modal{background:var(--surface);border-radius:var(--radius);width:100%;max-width:820px;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.modal header{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal header h3{font-family:"IBM Plex Serif",serif;font-size:17px}
.modal .body{padding:18px}
.modal footer{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--surface-2)}
.x{margin-left:auto;background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.x:hover{color:var(--crit)}

#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--rail);color:#EAF2EC;padding:11px 15px;border-radius:var(--radius);font-size:13px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);max-width:340px;animation:in .18s ease-out}
.toast.bad{background:var(--crit)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:26px;text-align:center;background:var(--surface-2);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;margin-bottom:5px}
.drop span{font-size:12.5px;color:var(--muted)}

.lines td{padding:6px 8px}
.lines input{padding:6px 8px}
.bar{height:5px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

/* ---------- екран входу ---------- */
.auth{min-height:100vh;display:grid;grid-template-columns:420px 1fr;background:var(--surface)}
.auth-side{background:var(--rail);color:#DCE5DE;padding:46px 40px;display:flex;flex-direction:column;justify-content:space-between}
.auth-side .cross{width:30px;height:30px;position:relative}
.auth-side .cross:before,.auth-side .cross:after{content:"";position:absolute;background:#7FBFA4}
.auth-side .cross:before{left:12px;top:0;width:6px;height:30px}
.auth-side .cross:after{top:12px;left:0;height:6px;width:30px}
.auth-side h1{font-family:"IBM Plex Serif",Georgia,serif;font-size:30px;color:#F2F7F3;margin:8px 0 10px;letter-spacing:-.01em;line-height:1.15}
.auth-side .org{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.24em;color:#7FBFA4;margin-top:24px}
.auth-side p{margin:0;color:#8B9C92;font-size:13.5px;line-height:1.55}
.auth-side .note{border-top:1px solid rgba(255,255,255,.1);padding-top:16px;font-size:12px;color:#7C8E84;line-height:1.55}
.auth-main{padding:46px 44px;max-width:620px;width:100%}
.auth-main h2{font-family:"IBM Plex Serif",serif;font-size:21px;margin-bottom:4px}
.auth-main .lede{color:var(--muted);font-size:13px;margin:0 0 22px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:9px;margin-bottom:26px}
.unit{
  text-align:left;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius);
  padding:13px 14px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:3px
}
.unit:hover{border-color:var(--accent);background:var(--surface-2)}
.unit.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.unit b{font-weight:500;font-size:13.5px}
.unit span{font-size:11px;color:var(--muted)}
.unit .code{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;color:var(--faint)}
.auth-form{border-top:1px solid var(--line);padding-top:22px;animation:in .18s ease-out}
.auth-err{background:var(--crit-soft);border:1px solid #E0B6BA;color:var(--crit);padding:9px 12px;border-radius:var(--radius);font-size:12.5px;margin-bottom:14px}
.auth-tip{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--warn);padding:11px 13px;border-radius:var(--radius);font-size:12px;color:var(--muted);margin-top:22px;line-height:1.55}
.auth-tip code{font-family:"IBM Plex Mono",monospace;background:#fff;border:1px solid var(--line);padding:1px 5px;border-radius:2px;color:var(--ink)}

/* ---------- профіль у панелі ---------- */
.me{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.me .av{
  width:34px;height:34px;border-radius:50%;background:var(--rail-3);color:#8FD3B4;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.04em
}
.me .who{min-width:0}
.me .who b{display:block;font-size:13px;font-weight:500;color:#EAF2EC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{font-size:11px;color:#8B9C92}
.me-acts{display:flex;gap:6px;flex-wrap:wrap}
.me-acts button{
  background:var(--rail-2);border:1px solid rgba(255,255,255,.13);color:#B8C7BE;
  padding:5px 9px;border-radius:var(--radius);font-size:11.5px;cursor:pointer
}
.me-acts button:hover{background:var(--rail-3);color:#fff;border-color:rgba(255,255,255,.25)}

@media (max-width:860px){ .auth{grid-template-columns:1fr} .auth-side{padding:30px 24px} .auth-side h1{font-size:24px;margin-top:16px} .auth-main{padding:26px 24px} }
@media (max-width:1080px){ .g4{grid-template-columns:repeat(2,1fr)} .split{grid-template-columns:1fr} .g3{grid-template-columns:1fr} .g2{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto}
  .nav{flex-direction:row;overflow:auto;padding:8px}
  .nav button{width:auto;white-space:nowrap}
  .role-box{display:flex;gap:10px;align-items:center}
  .role-box .eyebrow,.role-box .hint{display:none}
  .view{padding:16px}
  .topbar{padding:14px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="auth" hidden></div>

<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand">
      <div class="org">КІ НГУ</div>
      <div class="mark"><div class="cross"></div><h1>Медична частина</h1></div>
      <p>Облік і рух медикаментів</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="role-box" id="meBox"></div>
  </aside>
  <main class="work">
    <div class="topbar">
      <div>
        <h2 id="ttl">Дашборд</h2>
        <div class="sub" id="sub"></div>
      </div>
      <div class="spacer"></div>
      <div id="actions" class="row"></div>
    </div>
    <div class="view" id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>


<script>
/* ---------------------------------------------------------------
   Серверне сховище. У Claude застосунок користується window.storage;
   на Render його немає, тому тут той самий інтерфейс поверх /api/kv.
   Ключ сесії лишається у браузері, решта — спільна для всіх.
----------------------------------------------------------------*/
(function(){
  var LOCAL = function(k){ return String(k).indexOf("medcrm:sess") === 0; };
  var revs = {}, syncing = false;

  async function req(method, url, body){
    var r = await fetch(url, {
      method: method, credentials: "same-origin",
      headers: body ? {"Content-Type":"application/json"} : undefined,
      body: body ? JSON.stringify(body) : undefined
    });
    if(r.status === 401){ location.href = "/login"; throw new Error("Потрібен вхід"); }
    return r;
  }

  window.storage = {
    async get(key){
      if(LOCAL(key)){
        var v = localStorage.getItem(key);
        if(v === null) throw new Error("Ключа немає");
        return {key:key, value:v};
      }
      var r = await req("GET", "/api/kv/" + encodeURIComponent(key));
      if(r.status === 404) throw new Error("Ключа немає");
      var j = await r.json(); revs[key] = j.rev;
      return {key:key, value:j.value};
    },
    async set(key, value){
      if(LOCAL(key)){ localStorage.setItem(key, value); return {key:key, value:value}; }
      var r = await req("PUT", "/api/kv/" + encodeURIComponent(key),
                        {value:value, rev: revs[key] == null ? null : revs[key]});
      if(r.status === 409){ conflict(); throw new Error("Дані змінив інший користувач"); }
      var j = await r.json(); revs[key] = j.rev;
      return {key:key, value:value};
    },
    async delete(key){
      if(LOCAL(key)){ localStorage.removeItem(key); return {key:key, deleted:true}; }
      await req("DELETE", "/api/kv/" + encodeURIComponent(key));
      delete revs[key];
      return {key:key, deleted:true};
    },
    async list(prefix){
      var r = await req("GET", "/api/kv?prefix=" + encodeURIComponent(prefix || ""));
      return await r.json();
    }
  };

  /* Якщо базу змінив інший підрозділ — тихо перечитуємо дані на місці.
     Перезавантаження сторінки використовується лише як запасний варіант. */
  var pulling = false;
  function busy(){
    var m = document.getElementById("modal-root");
    return !!(m && m.innerHTML.length);          // не смикаємо екран, поки відкрите вікно
  }
  async function pull(){
    if(pulling || busy()) return;
    pulling = true;
    try{
      if(window.medcrmSync){ await window.medcrmSync(); note("Дані оновив інший користувач — перелік актуалізовано"); }
      else location.reload();
    }catch(e){}
    pulling = false;
  }
  function conflict(){ setTimeout(pull, 50); }

  function note(text){
    var t = document.createElement("div");
    t.style.cssText = "position:fixed;right:18px;bottom:18px;z-index:200;background:#14624F;color:#EAF2EC;" +
      "padding:11px 15px;border-radius:3px;font:13px/1.4 'IBM Plex Sans',system-ui,sans-serif;" +

const dstr = s => { const d=dparse(s); return d? String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear() : "—"; };

function shelf(exp){
  const d = daysLeft(exp);
  if(d===null) return {k:"none", label:"Без терміну", cls:""};
  if(d < 0)    return {k:"expired", label:"Прострочено "+Math.abs(d)+" дн.", cls:"crit"};
  if(d <= 30)  return {k:"critical", label:"Спливає через "+d+" дн.", cls:"crit"};
  if(d <= 90)  return {k:"soon", label:"Спливає через "+d+" дн.", cls:"warn"};
  return {k:"ok", label:"Придатний "+d+" дн.", cls:"ok"};
}

/* ---------- сховище ---------- */
function blank(){
  return {items:[], batches:[], requests:[], log:[], rx:[], assets:[], tasks:[], taskLog:[], users:[], role:"apteka", inv:0, req:0, rxNo:0};
}
async function load(){
  try{
    const r = await window.storage.get(SKEY);
    if(r && r.value){ S = JSON.parse(r.value); }
  }catch(e){ /* ключа ще немає */ }
  if(!S || !Array.isArray(S.items) || !Array.isArray(S.batches)){ S = blank(); seed(); }
  if(!S.users) S.users = [];
  S.role = S.role in LOCS ? S.role : "apteka";
  await ensureUsers();
  migrate();
  await loadSess();
  lastSaved = snapshot();
  save();
}
/* приведення раніше збереженої бази до нової моделі */
function migrate(){
  ["items","batches","requests","log","rx","assets","tasks","taskLog","users"].forEach(k=>{ if(!Array.isArray(S[k])) S[k] = []; });
  S.items.forEach(i => { if(!i.inn) i.inn = guessINN(i.name); });
  if(typeof S.req !== "number") S.req = S.requests.length;
  if(typeof S.inv !== "number") S.inv = 0;
  if(!S.rx) S.rx = [];
  if(S.rxNo == null) S.rxNo = 0;
  const stuck = S.batches.filter(b=>b.loc==="doctors" && b.qty>0.0001);
  if(stuck.length){
    stuck.forEach(b=>{ addBatch("apteka", b.itemId, b.qty, b.price, b.expiry, b.src); b.qty = 0; });
    S.batches = S.batches.filter(b=>b.qty>0.0001);
    log("Система", `Лікарі більше не зберігають медикаменти: ${stuck.length} партій повернуто на склад аптеки`);
  }
  S.requests.filter(r=>r.status==="pending" && r.from==="doctors").forEach(r=>{
    r.status = "cancelled"; r.closed = Date.now();
    log("Система", `Заявку ${r.no} скасовано: лікарі тепер користуються рецептами`);
  });
}
let saveT = null, lastSaved = null, saving = false;

/* Запис у сховище. Головне правило: якщо стан не змінився — не пишемо нічого.
   Інакше кожне відкриття вкладки рахувалося б зміною, і всі інші користувачі
   без потреби перечитували б базу. */
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(flush, 400);
}
/* Знімок для запису. Поточний підрозділ (S.role) у нього не входить:
   він у кожного свій, і якби зберігався у спільній базі, кожен користувач
   переписував би його одразу після іншого — нескінченний обмін записами. */
function snapshot(){
  const c = Object.assign({}, S);
  delete c.role;
  return JSON.stringify(c);
}
const MERGE_ARRAYS = ["items","batches","requests","rx","assets","tasks","taskLog","users","log"];
const byId = arr => { const m = new Map(); (arr||[]).forEach(x=>{ if(x && x.id) m.set(x.id, x); }); return m; };

/* Тристороннє злиття: що було в базі (base), що зробив я (mine),
   що встиг записати інший підрозділ (theirs). Записи зіставляються за id,
   тому одночасні дії в різних місцях системи не затирають одна одну. */
function mergeArr(base, mine, theirs){
  const B = byId(base), M = byId(mine);
  const out = new Map((theirs||[]).map(x=>[x.id, x]));
  M.forEach((rec, id)=>{
    const b = B.get(id);
    if(!b){ out.set(id, rec); return; }                                  // я додав
    if(JSON.stringify(b) !== JSON.stringify(rec)) out.set(id, rec);      // я змінив
  });
  B.forEach((rec, id)=>{ if(!M.has(id)) out.delete(id); });              // я вилучив
  return [...out.values()];
}
function merge3(base, mine, theirs){
  const out = Object.assign({}, theirs);
  MERGE_ARRAYS.forEach(k => out[k] = mergeArr(base[k], mine[k], theirs[k]));
  out.log = (out.log||[]).sort((a,b)=>b.ts-a.ts).slice(0,1500);
  ["inv","req","rxNo"].forEach(k => out[k] = Math.max(Number(mine[k])||0, Number(theirs[k])||0));
  delete out.role;
  return out;
}
const isConflict = e => String((e && e.message) || e).indexOf("інший користувач") >= 0;
function reattachMe(){
  if(!ME) return;
  const u = (S.users || []).find(x => x.id === ME.id);
  if(u && u.active){ ME = u; S.role = u.loc; } else { ME = null; }
}

async function flush(attempt){
  attempt = attempt || 0;
  if(saving){ save(); return; }                 // запис уже триває — спробуємо згодом
  let txt;
  try{ txt = snapshot(); }catch(e){ return; }
  if(txt === lastSaved) return;                 // змін немає
  saving = true;
  try{
    await window.storage.set(SKEY, txt);
    lastSaved = txt;
  }catch(e){
    if(isConflict(e) && attempt < 3){
      try{
        const r = await window.storage.get(SKEY);
        const theirs = JSON.parse(r.value);
        S = merge3(lastSaved ? JSON.parse(lastSaved) : theirs, S, theirs);
        reattachMe();
        saving = false;
        await flush(attempt + 1);               // записуємо вже злите
        render();
        return;
      }catch(err){ console.warn("Не вдалось злити зміни:", err); }
    }
    console.warn("Не вдалось зберегти:", e);
  }
  saving = false;
}

/* Перечитування бази, коли її змінив інший підрозділ.
   Оновлюємо стан на місці, без перезавантаження сторінки. */
async function syncFromServer(){
  try{
    const r = await window.storage.get(SKEY);
    if(!r || !r.value) return false;
    const theirs = JSON.parse(r.value);
    if(!theirs || !Array.isArray(theirs.items) || !Array.isArray(theirs.batches)) return false;

    if(lastSaved && snapshot() !== lastSaved){    // у мене є незбережені зміни — зливаємо
      S = merge3(JSON.parse(lastSaved), S, theirs);
      migrate(); reattachMe(); render(); save();
      return true;
    }
    S = theirs;
    migrate(); reattachMe();
    lastSaved = snapshot();
    render();
    return true;
  }catch(e){ return false; }
}
window.medcrmSync = syncFromServer;
function log(type, text, extra, as){
  const who = as || (typeof ME!=="undefined" && ME ? {loc:ME.loc, name:ME.name} : {loc:S.role, name:"Система"});
  S.log.unshift({id:uid("l"), ts:Date.now(), actor:who.loc, user:who.name, type, text, extra:extra||null});
  if(S.log.length>1500) S.log.length=1500;
}

/* ---------- позиції та партії ---------- */
/* ---------- діюча речовина та аналоги ----------
   Речовина визначається з назви: беремо слова до першої дози або коми.
   «Парацетамол 500 мг, табл.» → парацетамол. Поле редаговане. */
const normINN = v => String(v||"").toLowerCase().replace(/[\u2019\u02BC]/g,"'").replace(/\s+/g," ").trim();
function guessINN(name){
  const first = String(name||"").split(",")[0].trim();
  const out = [];
  for(const w of first.split(/\s+/)){
    if(/^[\d(]/.test(w) || /%/.test(w)) break;
    if(out.length && /^(мг|г|мл|мкг|од|мо|табл|капс|амп|фл|шт|№)/i.test(w)) break;
    out.push(w);
    if(out.length >= 3) break;
  }
  // «Парацетамол-Дарниця» → «Парацетамол»: відсікаємо назву виробника після дефіса
  return out.join(" ").replace(/-[А-ЯІЇЄҐA-Z][\wА-Яа-яІіЇїЄєҐґ'\u2019]{2,}$/u, "");
}
function analogs(itemId){
  const it = item(itemId), k = normINN(it.inn);
  if(!k) return [];
  return S.items.filter(x => x.id !== itemId && normINN(x.inn) === k)
    .sort((a,b)=>a.name.localeCompare(b.name,"uk"));
}
const stockOf = id => STOCK.reduce((s2,l)=>s2+avail(l,id), 0);
function analogHTML(itemId, chain){
  const list = analogs(itemId);
  if(!list.length) return "";
  const part = x => {
    const locs = (chain || STOCK).filter(l => avail(l, x.id) > 0.0001)
      .map(l => LOCS[l].short + " " + qty(avail(l, x.id))).join(" · ");
    return `<span class="tag ${locs?"acc":""}" style="margin:2px 4px 0 0">${esc(x.name)}${locs?" — "+locs:" — немає"}</span>`;
  };
  return `<div style="margin-top:6px"><span class="eyebrow">Аналоги за діючою речовиною «${esc(item(itemId).inn)}»</span>
    <div style="display:flex;flex-wrap:wrap;margin-top:4px">${list.map(part).join("")}</div></div>`;
}

function findItem(name, nomen, unit){
  const key = (nomen||"").trim().toLowerCase();
  let it = key ? S.items.find(i => (i.nomen||"").toLowerCase() === key) : null;
  if(!it) it = S.items.find(i => i.name.trim().toLowerCase() === String(name).trim().toLowerCase());
  if(it){
    if(nomen && !it.nomen) it.nomen = nomen;
    if(unit && !it.unit) it.unit = unit;
    return it;
  }
  it = {id:uid("i"), name:String(name).trim(), nomen:(nomen||"").trim(), unit:(unit||"шт").trim()};
  it.inn = guessINN(it.name);
  S.items.push(it);
  return it;
}
const item = id => S.items.find(i=>i.id===id) || {name:"— видалено —", nomen:"", unit:""};
const atLoc = loc => S.batches.filter(b => b.loc===loc && b.qty > 0.0001);
function avail(loc, itemId){ return atLoc(loc).filter(b=>b.itemId===itemId).reduce((s,b)=>s+b.qty,0); }
function stockRows(loc){
  const m = new Map();
  atLoc(loc).forEach(b=>{
    if(!m.has(b.itemId)) m.set(b.itemId, {itemId:b.itemId, qty:0, sum:0, batches:[]});
    const r = m.get(b.itemId);
    r.qty += b.qty; r.sum += b.qty*(b.price||0); r.batches.push(b);
  });
  const rows = [...m.values()];
  rows.forEach(r=>{
    r.batches.sort((a,b)=> (dparse(a.expiry)||9e15) - (dparse(b.expiry)||9e15));
    r.nearest = r.batches[0] ? r.batches[0].expiry : null;
    r.item = item(r.itemId);
  });
  rows.sort((a,b)=> a.item.name.localeCompare(b.item.name,"uk"));
  return rows;
}
const itemBatches = id => S.batches.filter(b=>b.itemId===id && b.qty>0.0001)
  .sort((a,b)=> (dparse(a.expiry)||9e15)-(dparse(b.expiry)||9e15) || ORDER.indexOf(a.loc)-ORDER.indexOf(b.loc));

/* після правки термінів однакові партії зливаються в одну */
function mergeDupes(){
  const seen = new Map();
  S.batches.forEach(b=>{
    const k = [b.loc, b.itemId, b.expiry||"", Math.round((b.price||0)*100)].join("|");
    if(seen.has(k)){ const f = seen.get(k); f.qty += b.qty; b.qty = 0; }
    else seen.set(k, b);
  });
  S.batches = S.batches.filter(b=>b.qty>0.0001);
}

function addBatch(loc, itemId, q, price, expiry, src){
  const same = S.batches.find(b => b.loc===loc && b.itemId===itemId && (b.expiry||"")===(expiry||"") && Math.abs((b.price||0)-(price||0))<0.005);
  if(same){ same.qty += q; return same; }
  const b = {id:uid("b"), loc, itemId, qty:q, price:price||0, expiry:expiry||"", src:src||"", at:Date.now()};
  S.batches.push(b); return b;
}
/* FEFO: спершу те, що швидше спливає */
function takeFEFO(loc, itemId, need){
  const src = atLoc(loc).filter(b=>b.itemId===itemId)
    .sort((a,b)=> (dparse(a.expiry)||9e15) - (dparse(b.expiry)||9e15));
  const taken = []; let left = need;
  for(const b of src){
    if(left <= 0.0001) break;
    const t = Math.min(b.qty, left);
    b.qty = Math.round((b.qty - t)*1000)/1000; left -= t;
    taken.push({price:b.price, expiry:b.expiry, qty:t, src:b.src});
  }
  S.batches = S.batches.filter(b=>b.qty>0.0001);
  return {taken, short: Math.round(left*1000)/1000};
}

/* ---------- ланцюг списання за рецептом ----------
   Спершу пост медсестри, далі старша медсестра, і лише потім склад аптеки. */
const RX_CHAIN = ["post","senior","apteka"];
const CITO_CHAIN = ["apteka"];                       // Cito! — одразу зі складу аптеки
const rxChain = r => (r && r.cito) ? CITO_CHAIN : RX_CHAIN;
const rxAvail = (itemId, chain) => (chain || RX_CHAIN).reduce((s,l)=>s+avail(l,itemId), 0);
function rxStockRows(){
  const m = new Map();
  RX_CHAIN.forEach(loc => stockRows(loc).forEach(r => {
    const cur = m.get(r.itemId);
    if(cur){ cur.qty += r.qty; cur.sum += r.sum; cur.per[loc] = r.qty; }
    else m.set(r.itemId, {itemId:r.itemId, item:r.item, qty:r.qty, sum:r.sum, per:{[loc]:r.qty}});
  }));
  return [...m.values()].sort((a,b)=>a.item.name.localeCompare(b.item.name,"uk"));
}
/* скільки і звідки візьмемо, не змінюючи залишків */
function planTake(itemId, need, chain){
  const plan = []; let left = need;
  for(const loc of (chain || RX_CHAIN)){
    if(left <= 0.0001) break;
    const has = avail(loc, itemId);
    if(has <= 0.0001) continue;
    const q = Math.min(has, left);
    plan.push({loc, qty:q}); left -= q;
  }
  return plan;
}
/* що ще треба видати за рецептом */
function rxRemaining(r){
  return r.lines.map((l, i) => ({i, l, need: Math.round((l.want - (l.got||0))*1000)/1000}))
    .filter(x => x.need > 0.0001);
}
/* розкладка залишку по підрозділах у порядку ланцюга */
function rxPlanAll(r){
  const chain = rxChain(r), byLoc = new Map();
  rxRemaining(r).forEach(({i, l, need}) => {
    planTake(l.itemId, need, chain).forEach(pt => {
      if(!byLoc.has(pt.loc)) byLoc.set(pt.loc, []);
      byLoc.get(pt.loc).push({i, itemId:l.itemId, qty:pt.qty});
    });
  });
  return chain.filter(l => byLoc.has(l)).map(l => ({loc:l, items:byLoc.get(l)}));
}
/* чия черга видавати: підрозділ, з якого списується першим */
const rxExecutor = r => { const p = rxPlanAll(r); return p.length ? p[0].loc : null; };
/* закриваємо рецепт, коли віддавати більше нічого або нема звідки */
function rxSettle(r){
  const rem = rxRemaining(r);
  if(!rem.length){ r.status = "issued"; r.closed = Date.now(); return "issued"; }
  if(!rem.some(x => rxAvail(x.l.itemId, rxChain(r)) > 0.0001)){ r.status = "partial"; r.closed = Date.now(); return "partial"; }
  return "pending";
}
const planLabel = p => p.length ? p.map(x => LOCS[x.loc].short + " " + qty(x.qty)).join(" · ") : "—";
const haveLabel = (itemId, chain) => (chain || RX_CHAIN).filter(l => avail(l, itemId) > 0.0001)
  .map(l => LOCS[l].short + " " + qty(avail(l, itemId))).join(" · ") || "немає";

const pendingFor = loc => pending().filter(r=>r.to===loc);

const SESS = "medcrm:sess";
const SESS_TTL = 12*3600e3;          // сесія живе 12 годин
const START_PASS = "medchastyna";    // стартовий пароль, змінюється при першому вході
const MIN_PASS = 6;

async function sha(txt){
  try{
    const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }catch(e){ // запасний варіант, якщо crypto.subtle недоступний
    let h = 5381; for(let i=0;i<txt.length;i++) h = ((h*33) ^ txt.charCodeAt(i)) >>> 0;
    return "fallback:" + h.toString(16) + ":" + txt.length;
  }
}
const hash = (pass, salt) => sha(salt + "::" + pass);

async function mkUser(loc, name, login, pass, admin, must){
  const salt = uid("s");
  return {id:uid("u"), loc, name, login:login.trim().toLowerCase(), salt,
          pass: await hash(pass, salt), admin:!!admin, must:!!must, active:true, last:null};
}
async function ensureUsers(){
  if(S.users && S.users.length) return;
  S.users = [];
  const defs = [
    ["apteka",  "Завідувач аптеки",       "apteka",   true],
    ["senior",  "Старша медсестра",       "senior",   false],
    ["feldsher","Фельдшер",               "feldsher", false],
    ["doctors", "Черговий лікар",         "doctors",  false],
    ["post",    "Медсестра поста",        "post",     false]
  ];
  for(const d of defs) S.users.push(await mkUser(d[0], d[1], d[2], START_PASS, d[3], true));
}
const usersAt = loc => (S.users||[]).filter(u=>u.loc===loc && u.active);
const initials = n => n.split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();

async function saveSess(){ try{ await window.storage.set(SESS, JSON.stringify({uid:ME.id, at:Date.now()})); }catch(e){} }
async function loadSess(){
  try{
    const r = await window.storage.get(SESS);
    if(!r || !r.value) return;
    const s = JSON.parse(r.value);
    if(Date.now() - s.at > SESS_TTL) return;
    const u = (S.users||[]).find(x=>x.id===s.uid && x.active);
    if(u){ ME = u; S.role = u.loc; }
  }catch(e){}
}
async function logout(){
  if(ME) log("Доступ", "Вихід із системи");
  ME = null; authPick = null; authErr = "";
  try{ await window.storage.delete(SESS); }catch(e){}
  save(); render();
}

async function tryLogin(id, pass){
  const u = (S.users||[]).find(x=>x.id===id);
  if(!u || !u.active){ authErr = "Обліковий запис недоступний."; return renderAuth(); }
  const f = fails[u.id] || {n:0, until:0};
  if(Date.now() < f.until){
    authErr = "Забагато невдалих спроб. Спробуйте за " + Math.ceil((f.until-Date.now())/1000) + " с.";
    return renderAuth();
  }
  if(!pass){ authErr = "Введіть пароль."; return renderAuth(); }
  const h = await hash(pass, u.salt);
  if(h !== u.pass){
    f.n++;
    if(f.n >= 5){ f.until = Date.now() + 60000; f.n = 0; }
    fails[u.id] = f;
    log("Доступ", `Невдала спроба входу: ${u.name}`, null, {loc:u.loc, name:u.name});
    authErr = f.until > Date.now() ? "Пароль невірний. Вхід заблоковано на 60 секунд." : "Пароль невірний. Залишилось спроб: " + (5 - f.n) + ".";
    save(); return renderAuth();
  }
  fails[u.id] = {n:0, until:0};
  ME = u; S.role = u.loc; u.last = Date.now();
  log("Доступ", "Вхід у систему");
  await saveSess();
  authErr = ""; authPick = null;
  render();
  if(u.must) changePassModal(true);
}

function changePassModal(forced){
  modal(forced ? "Змініть стартовий пароль" : "Зміна пароля", `

    <div class="grid g2">
      ${forced? "" : `<div class="field" style="grid-column:1/-1"><label>Поточний пароль</label><input type="password" id="p0"></div>`}
      <div class="field"><label>Новий пароль (від ${MIN_PASS} символів)</label><input type="password" id="p1"></div>
      <div class="field"><label>Повторіть новий пароль</label><input type="password" id="p2"></div>
    </div>`,
    [ ...(forced?[]:[{t:"Скасувати", f:close}]),
      {t:"Зберегти пароль", cls:"primary", f:async ()=>{
        if(!forced){
          const cur = document.getElementById("p0").value;
          if(await hash(cur, ME.salt) !== ME.pass) return toast("Поточний пароль невірний", true);
        }
        const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
        if(p1.length < MIN_PASS) return toast("Пароль має містити щонайменше " + MIN_PASS + " символів", true);
        if(p1 !== p2) return toast("Паролі не збігаються", true);
        if(p1 === START_PASS) return toast("Цей пароль стартовий — оберіть інший", true);
        ME.salt = uid("s"); ME.pass = await hash(p1, ME.salt); ME.must = false;
        log("Доступ", "Пароль змінено");
        close(); toast("Пароль оновлено"); render();
      }}],
    {noclose: !!forced});
}

/* ---------- ПІДПИС: календар донесень ---------- */
function termsStrip(root){
  const tasks = (S.tasks||[]).filter(t => t.active !== false).filter(t => ME.admin || t.loc === ME.loc);
  const daily = tasks.filter(t => t.period === "daily");
  const rest  = tasks.filter(t => t.period !== "daily");
  const start = today();
  const days  = [...Array(14)].map((_, i) => { const d = new Date(start); d.setDate(d.getDate() + i); return d; });
  const overdue = rest.map(t => ({t, st: taskState(t)})).filter(x => x.st.k === "overdue");
  const dailyLeft = daily.filter(t => !taskDone(t)).length;

  const chip = (t, d, cls) => `<div class="tchip ${cls}" title="${esc(t.title + " · " + LOCS[t.loc].name + (t.doc ? " · " + t.doc : ""))}">${esc(t.title)}</div>`;

  root.insertAdjacentHTML("beforeend", `
  <div class="ribbon">
    <div class="head">
      <h3 style="font-size:14px">Терміни донесень</h3>
      <span class="eyebrow">наступні два тижні${ME.admin ? " · усі підрозділи" : " · " + LOCS[ME.loc].name}</span>
      <div class="legend">
        <span><i style="background:#9E2430"></i>прострочено</span>
        <span><i style="background:#B08A1E"></i>строк настав</span>
        <span><i style="background:#3E7F63"></i>здано</span>
      </div>
    </div>

    ${daily.length ? `<div class="tdaily">
      <span class="eyebrow">Щоденні</span>
      ${daily.map(t => `<div class="tchip ${taskDone(t) ? "done" : "today"}" title="${esc(t.title)}">${esc(t.title)}</div>`).join("")}
      <span class="sub2" style="margin-left:auto">${dailyLeft ? "не подано сьогодні: " + dailyLeft : "усі подано"}</span>
    </div>` : ""}

    ${overdue.length ? `<div class="tdaily" style="background:var(--crit-soft)">
      <span class="eyebrow" style="color:var(--crit)">Прострочено</span>
      ${overdue.map(({t, st}) => `<div class="tchip over" title="${esc(t.title)}">${esc(t.title)} — ${dstr(st.due)}</div>`).join("")}
    </div>` : ""}

    ${rest.length ? `<div class="tstrip">
      ${days.map(d => {
        const due = rest.filter(t => +dueDate(t, d) === +d);
        const isToday = +d === +start;
        const wd = (d.getDay() + 6) % 7;
        return `<div class="tday ${isToday ? "now" : ""} ${wd > 4 ? "off" : ""}">
          <div class="tdate"><b>${d.getDate()}</b> ${WD2[wd]}</div>
          ${due.map(t => {
            const done = taskDone(t, d);
            return chip(t, d, done ? "done" : (isToday ? "today" : "wait"));
          }).join("")}
        </div>`;
      }).join("")}
    </div>` : `<div class="empty" style="padding:26px 20px"><strong>Періодичних донесень немає</strong>Перелік ведеться у вкладці «Терміни виконання».</div>`}
  </div>`);
}

        ${STOCK.map(l=>`<th class="num">${LOCS[l].short}</th>`).join("")}<th class="num">Разом</th>
        <th>Найближчий термін</th>${canEditExp?"<th></th>":""}</tr></thead><tbody>
        ${list.map(i=>{const per=STOCK.map(l=>avail(l,i.id)); const tot=per.reduce((a,b)=>a+b,0);

          <td class="name">${esc(i.name)}</td><td class="mono sub2">${esc(i.nomen||"—")}</td>

          <td>${esc(i.unit)}</td>
          ${per.map(x=>`<td class="num" style="${x?"":"color:var(--faint)"}">${x?qty(x):"—"}</td>`).join("")}

/* ---------- виправлення термінів придатності (лише завідувач аптеки) ---------- */
function expiryModal(itemId){
  if(!(ME.loc==="apteka" && ME.admin)) return toast("Термін придатності виправляє лише завідувач аптеки", true);
  const it = item(itemId);
  const bs = itemBatches(itemId);
  if(!bs.length) return toast("У цього препарату немає партій на залишках", true);

  modal(`Термін придатності — ${esc(it.name)}`, `
    <p class="sub2" style="margin-top:0">Термін зберігається окремо для кожної партії. Виправляйте його, якщо в накладній була помилка або дату не вдалося розпізнати під час імпорту.</p>
    <div class="tw" style="max-height:340px"><table><thead><tr>
        <th>Де зберігається</th><th class="num">Кількість</th><th class="num">Ціна</th>
        <th>Надійшло за</th><th style="width:180px">Придатний до</th><th>Стан</th></tr></thead><tbody>
      ${bs.map(b=>{const sh=shelf(b.expiry); return `<tr>
        <td><span class="tag">${LOCS[b.loc].short}</span> ${LOCS[b.loc].name}</td>
        <td class="num">${qty(b.qty)} ${esc(it.unit)}</td>
        <td class="num">${money(b.price)}</td>
        <td class="sub2">${esc(b.src||"—")}</td>
        <td><input type="date" data-bx="${b.id}" value="${esc(b.expiry||"")}"></td>
        <td><span class="tag ${sh.cls}" data-st="${b.id}"><span class="dot"></span>${sh.label}</span></td>
      </tr>`}).join("")}
    </tbody></table></div>
    <div class="field" style="margin-top:14px"><label>Підстава для виправлення</label>
      <input type="text" id="exp-why" placeholder="Наприклад: помилка в накладній НК-004, звірено з упаковкою"></div>`,
    [{t:"Скасувати", f:close},{t:"Зберегти терміни", cls:"primary", f:save2}]);

  // стан оновлюється одразу, ще до збереження
  document.querySelectorAll("[data-bx]").forEach(inp=>inp.oninput = ()=>{
    const tag = document.querySelector(`[data-st="${inp.dataset.bx}"]`);
    const sh = shelf(inp.value);
    if(tag){ tag.className = "tag " + sh.cls; tag.innerHTML = `<span class="dot"></span>${sh.label}`; }
  });

  function save2(){
    const why = document.getElementById("exp-why").value.trim();
    const changes = [];
    document.querySelectorAll("[data-bx]").forEach(inp=>{
      const b = S.batches.find(x=>x.id===inp.dataset.bx);
      if(!b) return;
      const was = b.expiry || "", now = inp.value || "";
      if(was !== now) changes.push({b, was, now});
    });
    if(!changes.length){ close(); return toast("Терміни не змінювались"); }
    changes.forEach(c=>{
      c.b.expiry = c.now;
      log("Виправлення", `Термін придатності «${it.name}» (${LOCS[c.b.loc].name}, ${qty(c.b.qty)} ${it.unit}): `
        + `${c.was?dstr(c.was):"не вказано"} → ${c.now?dstr(c.now):"не вказано"}${why?" — "+why:""}`,
        {item:it.name, was:c.was, now:c.now});
    });
    mergeDupes();
    close();
    toast(changes.length===1 ? "Термін виправлено" : "Виправлено термінів: " + changes.length);
    render();
  }
}

/* ---------- імпорт накладної ---------- */
const HEAD = {
  name:["назва","найменування","препарат","номенклатура","товар","майно"],
  nomen:["номенклатурний","ном. номер","номер","код","артикул"],
  qty:["кількість","к-сть","кіл-ть","кол-во"],
  price:["ціна","вартість"],
  unit:["одиниц","од.","од вим","міра"],
  exp:["термін","придатн","придатний до"]
};
function mapCols(header){
  const m = {};
  header.forEach((h,i)=>{
    const s = String(h||"").toLowerCase().trim();
    for(const k in HEAD){ if(m[k]==null && HEAD[k].some(x=>s.includes(x))) m[k]=i; }
  });
  return m;
}
function xlDate(v){
  if(v==null || v==="") return "";
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v === "number"){ const d = new Date(Date.UTC(1899,11,30) - 0 + v*86400000); return isNaN(d)?"":d.toISOString().slice(0,10); }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; return new Date(Date.UTC(y,+m[2]-1,+m[1])).toISOString().slice(0,10); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return new Date(Date.UTC(+m[1],+m[2]-1,+m[3])).toISOString().slice(0,10);
  m = s.match(/^(\d{1,2})[.\/-](\d{4})$/); // місяць.рік → останній день місяця
  if(m) return new Date(Date.UTC(+m[2], +m[1], 0)).toISOString().slice(0,10);
  const d = new Date(s); return isNaN(d)?"":d.toISOString().slice(0,10);
}
const num = v => { if(typeof v==="number") return v; const n = parseFloat(String(v==null?"":v).replace(/\s/g,"").replace(",",".")); return isNaN(n)?0:n; };

function importModal(){
  modal("Завантаження накладної", `
    <div class="field" style="margin-bottom:14px;max-width:300px"><label>Номер / назва накладної</label>
      <input type="text" id="invno" value="НК-${String((S.inv||0)+1).padStart(3,"0")} від ${dstr(new Date())}"></div>
    <div class="drop" id="drop">
      <strong>Перетягніть файл Excel або натисніть, щоб вибрати</strong>
      <span>Підтримується .xlsx, .xls і .csv. Колонки: назва препарату, номенклатурний номер, одиниця виміру, кількість, ціна за одиницю, термін придатності</span>
      <input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div style="margin-top:12px"><button class="btn sm" id="tpl">Завантажити шаблон накладної</button></div>
    <div id="prev" style="margin-top:14px"></div>`,
    [{t:"Закрити", f:close}]);

  const drop = $("#drop"), file = $("#file");
  drop.onclick = ()=>file.click();
  drop.ondragover = e=>{e.preventDefault();drop.classList.add("over")};
  drop.ondragleave = ()=>drop.classList.remove("over");
  drop.ondrop = e=>{e.preventDefault();drop.classList.remove("over"); if(e.dataTransfer.files[0]) read(e.dataTransfer.files[0]);};
  file.onchange = e=>{ if(e.target.files[0]) read(e.target.files[0]); };
  $("#tpl").onclick = template;

  function read(f){
    const fr = new FileReader();
    fr.onload = ev=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:"array", cellDates:true});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
        parse(aoa, f.name);
      }catch(err){ toast("Не вдалося прочитати файл: " + err.message, true); }
    };
    fr.readAsArrayBuffer(f);
  }
  function parse(aoa, fname){
    let hi = -1, map = null;
    for(let i=0;i<Math.min(aoa.length,15);i++){
      const m = mapCols(aoa[i]);
      if(m.name!=null && m.qty!=null){ hi=i; map=m; break; }
    }
    if(hi<0){ $("#prev").innerHTML = `<div class="empty"><strong>Не знайдено заголовки</strong>Потрібні щонайменше колонки «Назва препарату» та «Кількість».</div>`; return; }
    const rows = [];
    for(let i=hi+1;i<aoa.length;i++){
      const r = aoa[i]; if(!r) continue;
      const name = String(r[map.name]||"").trim();
      if(!name) continue;
      const q = num(r[map.qty]); if(q<=0) continue;
      rows.push({
        name,
        nomen: map.nomen!=null ? String(r[map.nomen]||"").trim() : "",
        unit:  map.unit!=null  ? String(r[map.unit]||"").trim() || "шт" : "шт",
        qty:q,
        price: map.price!=null ? num(r[map.price]) : 0,
        exp:   map.exp!=null   ? xlDate(r[map.exp]) : ""
      });
    }
    if(!rows.length){ $("#prev").innerHTML = `<div class="empty"><strong>Рядків не знайдено</strong>Перевірте, що під заголовками є дані з кількістю більшою за нуль.</div>`; return; }
    const sum = rows.reduce((s,r)=>s+r.qty*r.price,0);
    $("#prev").innerHTML = `<div class="card"><header><h3>Перевірка: ${rows.length} рядків · ${money(sum)} грн</h3>
        <span class="spacer"></span><span class="eyebrow">${esc(fname)}</span></header>
      <div class="tw" style="max-height:280px"><table><thead><tr><th>Назва</th><th>Ном.</th><th>Од.</th><th class="num">К-сть</th><th class="num">Ціна</th><th>Придатний до</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono sub2">${esc(r.nomen||"—")}</td><td>${esc(r.unit)}</td>
          <td class="num">${qty(r.qty)}</td><td class="num">${money(r.price)}</td>
          <td class="mono" ${r.exp?"":'style="color:var(--crit)"'}>${r.exp?dstr(r.exp):"не розпізнано"}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="pad"><button class="btn primary" id="commit">Оприбуткувати ${rows.length} рядків</button></div></div>`;
    $("#commit").onclick = ()=>{
      const inv = $("#invno").value.trim() || "без номера";
      rows.forEach(r=>{ const it = findItem(r.name, r.nomen, r.unit); addBatch("apteka", it.id, r.qty, r.price, r.exp, inv); });
      S.inv = (S.inv||0)+1;
      log("Надходження", `Накладна ${inv}: оприбутковано ${rows.length} позицій на суму ${money(sum)} грн`, {inv, count:rows.length, sum});
      close(); toast("Накладну оприбутковано: " + rows.length + " позицій"); render();
    };
  }
  function template(){
    const aoa = [
      ["Назва препарату","Номенклатурний номер","Одиниця виміру","Кількість","Ціна за одиницю","Термін придатності"],
      ["Натрію хлорид 0,9% 200 мл","2831.00.1","фл",100,42.5,"31.12.2027"],
      ["Парацетамол 500 мг, табл.","3004.90.2","уп",50,31.2,"30.06.2027"]
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Накладна");
    XLSX.writeFile(wb, "shablon-nakladnoi.xlsx");
  }
}

function manualModal(){
  const rows = S.items.map(i => ({i, tot: STOCK.reduce((s2,l)=>s2+avail(l,i.id), 0)}))
    .sort((a2,b2)=>a2.i.name.localeCompare(b2.i.name,"uk"));

  modal("Оприбуткувати вручну", `
    ${rows.length ? `<div class="field" style="margin-bottom:14px">
      <label>Препарат <span class="eyebrow" id="m-cnt" style="margin-left:6px"></span></label>
      <input type="text" id="m-find" placeholder="пошук за назвою або номенклатурним номером" style="margin-bottom:6px">
      <select id="m-pick"></select>
      <div class="sub2" id="m-hint" style="margin-top:6px"></div>
      <div id="m-alt"></div></div>` : ""}
    <div class="grid g2">
      <div class="field" style="grid-column:1/-1"><label>Назва препарату</label><input type="text" id="m-name"></div>
      <div class="field"><label>Номенклатурний номер</label><input type="text" id="m-nom"></div>
      <div class="field"><label>Діюча речовина</label><input type="text" id="m-inn" placeholder="визначається з назви"></div>
      <div class="field"><label>Одиниця виміру</label><input type="text" id="m-unit" value="шт"></div>
      <div class="field"><label>Кількість</label><input type="number" id="m-qty" step="any" min="0"></div>
      <div class="field"><label>Ціна за одиницю, грн</label><input type="number" id="m-price" step="any" min="0"></div>
      <div class="field"><label>Термін придатності</label><input type="date" id="m-exp"></div>
      <div class="field"><label>Накладна / підстава</label><input type="text" id="m-src" value="Ручне оприбуткування"></div>
    </div>`,
    [{t:"Скасувати", f:close},{t:"Оприбуткувати", cls:"primary", f:submit}]);

  const el = id => document.getElementById(id);
  if(rows.length){
    const drawPick = ()=>{
      const q = el("m-find").value.trim().toLowerCase();
      const list = q ? rows.filter(r => (r.i.name + " " + (r.i.nomen||"")).toLowerCase().indexOf(q) >= 0) : rows;
      const keep = el("m-pick").value;
      el("m-pick").innerHTML = `<option value="">— нова позиція, якої ще немає в каталозі —</option>` +
        list.map(r => `<option value="${r.i.id}">${esc(r.i.name)}${r.i.nomen?" · "+esc(r.i.nomen):""} — залишок ${qty(r.tot)} ${esc(r.i.unit)}</option>`).join("");
      if(list.some(r => r.i.id === keep)) el("m-pick").value = keep;
      el("m-cnt").textContent = q ? "знайдено: " + list.length : "у каталозі: " + rows.length;
      fill();
    };
    const fill = ()=>{
      const it = S.items.find(x => x.id === el("m-pick").value);
      el("m-alt").innerHTML = it ? analogHTML(it.id) : "";
      if(!it){ el("m-hint").textContent = "Заповніть поля вручну — позицію буде додано до каталогу."; return; }
      el("m-inn").value = it.inn || guessINN(it.name);
      el("m-name").value = it.name;
      el("m-nom").value  = it.nomen || "";
      el("m-unit").value = it.unit;
      const bs = S.batches.filter(b => b.itemId === it.id && b.qty > 0.0001)
        .sort((x,y)=>(dparse(x.expiry)||9e15)-(dparse(y.expiry)||9e15));
      if(bs.length && !el("m-price").value) el("m-price").value = bs[bs.length-1].price || "";
      el("m-hint").innerHTML = bs.length
        ? "Наявні партії: " + bs.slice(0,4).map(b => `${LOCS[b.loc].short} ${qty(b.qty)} до ${dstr(b.expiry)} по ${money(b.price)} грн`).join("; ")
          + (bs.length > 4 ? " та інші" : "") + ". Термін і ціну нової партії вкажіть окремо."
        : "Позиція є в каталозі, але залишків немає.";
    };
    el("m-name").oninput = ()=>{ if(!el("m-pick").value) el("m-inn").value = guessINN(el("m-name").value); };
    el("m-find").oninput = drawPick;
    el("m-pick").onchange = fill;
    drawPick();
  }

  function submit(){
    const name = el("m-name").value.trim(), q = parseFloat(el("m-qty").value) || 0;
    if(!name) return toast("Вкажіть назву препарату", true);
    if(q <= 0) return toast("Кількість має бути більшою за нуль", true);
    const picked = rows.length ? S.items.find(x => x.id === el("m-pick").value) : null;
    let it;
    if(picked){
      it = picked;
      const changes = [];
      if(picked.name !== name){ changes.push(`назва: «${picked.name}» → «${name}»`); picked.name = name; }
      const nom = el("m-nom").value.trim(), un = el("m-unit").value.trim() || "шт";
      if((picked.nomen||"") !== nom){ changes.push(`ном. номер: «${picked.nomen||"—"}» → «${nom||"—"}»`); picked.nomen = nom; }
      if(picked.unit !== un){ changes.push(`одиниця: «${picked.unit}» → «${un}»`); picked.unit = un; }
      const inn = el("m-inn").value.trim();
      if((picked.inn||"") !== inn){ changes.push(`діюча речовина: «${picked.inn||"—"}» → «${inn||"—"}»`); picked.inn = inn; }
      if(changes.length) log("Виправлення", `Змінено дані препарату в каталозі — ${changes.join("; ")}`);
    }else{
      it = findItem(name, el("m-nom").value, el("m-unit").value);
      const inn = el("m-inn").value.trim();
      if(inn) it.inn = inn;
    }
    addBatch("apteka", it.id, q, parseFloat(el("m-price").value) || 0, el("m-exp").value, el("m-src").value.trim());
    log("Надходження", `Оприбутковано ${qty(q)} ${it.unit} «${it.name}»${picked ? " (позиція вже була в каталозі)" : " (нова позиція)"}`);
    close(); toast("Оприбутковано"); render();
  }
}

function exportStock(){

  STOCK.forEach(loc=>{
    atLoc(loc).sort((a,b)=>item(a.itemId).name.localeCompare(item(b.itemId).name,"uk")).forEach(b=>{
      const it = item(b.itemId), s = shelf(b.expiry);
      aoa.push([LOCS[loc].name, it.name, it.nomen, it.unit, b.qty, b.price, Math.round(b.qty*b.price*100)/100, b.expiry?dstr(b.expiry):"", s.label]);

  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Залишки");
  XLSX.writeFile(wb, "zalyshky-" + new Date().toISOString().slice(0,10) + ".xlsx");
  log("Система", "Вивантажено звіт про залишки");
  toast("Файл сформовано");
}

  if(ME.loc==="post")   return ["post","senior"];

  return [ME.loc];
}
function unitSummary(loc){
  const rows = stockRows(loc);
  const bs = atLoc(loc);
  return {
    loc, rows,
    pos: rows.length,
    qty: rows.reduce((s,r)=>s+r.qty,0),
    sum: rows.reduce((s,r)=>s+r.sum,0),
    bad: bs.filter(b=>["expired","critical"].includes(shelf(b.expiry).k)).length,
    soon: bs.filter(b=>shelf(b.expiry).k==="soon").length
  };
}

  function drawUnit(){

  /* ланцюг «старша медсестра → пост» */
  function drawSupply(){
    const sr = stockRows("senior"), pr = stockRows("post");
    const pmap = new Map(pr.map(r=>[r.itemId, r]));
    const ids = [...new Set([...sr.map(r=>r.itemId), ...pr.map(r=>r.itemId)])];
    const list = ids.map(id=>{
      const it = item(id);
      const s = sr.find(r=>r.itemId===id), p = pmap.get(id);
      return {it, sq:s?s.qty:0, pq:p?p.qty:0, pExp:p?p.nearest:null, sExp:s?s.nearest:null};
    }).sort((a,b)=> (a.pq>0?0:1)-(b.pq>0?0:1) || a.it.name.localeCompare(b.it.name,"uk"));
    const gaps = list.filter(x=>x.pq<=0 && x.sq>0).length;

    $("#supply").innerHTML = `<div class="card"><header><h3>Забезпечення поста медсестри</h3>
        <span class="spacer"></span><span class="eyebrow">${gaps? gaps+" позицій є у старшої, але немає на посту" : "пост укомплектовано"}</span></header>
      ${list.length? `<div class="tw" style="max-height:420px"><table><thead><tr>
          <th>Препарат</th><th class="num">У старшої медсестри</th><th>Термін СМС</th>
          <th class="num">На посту</th><th>Термін ПМС</th><th>Стан</th></tr></thead><tbody>
        ${list.map(x=>{const ps=shelf(x.pExp), ss=shelf(x.sExp);
          const state = x.pq<=0 ? (x.sq>0? `<span class="tag warn"><span class="dot"></span>не видано на пост</span>` : `<span class="tag crit"><span class="dot"></span>немає ніде</span>`)
                      : ps.k==="expired" ? `<span class="tag crit"><span class="dot"></span>прострочене на посту</span>`
                      : ps.k==="critical" ? `<span class="tag warn"><span class="dot"></span>термін спливає</span>`
                      : `<span class="tag ok"><span class="dot"></span>у наявності</span>`;
          return `<tr>
            <td class="name">${esc(x.it.name)}<div class="sub2 mono">${esc(x.it.nomen||"—")}</div></td>
            <td class="num">${x.sq? qty(x.sq)+" "+esc(x.it.unit) : "—"}</td>
            <td class="mono sub2" style="color:${x.sq?SHELF_COLOR[ss.k]:"var(--faint)"}">${x.sq? dstr(x.sExp):"—"}</td>
            <td class="num" style="font-weight:600">${x.pq? qty(x.pq)+" "+esc(x.it.unit) : "—"}</td>
            <td class="mono sub2" style="color:${x.pq?SHELF_COLOR[ps.k]:"var(--faint)"}">${x.pq? dstr(x.pExp):"—"}</td>
            <td>${state}</td></tr>`}).join("")}
      </tbody></table></div>` : `<div class="empty"><strong>Залишків немає ні у старшої медсестри, ні на посту</strong>Подайте заявку до аптеки.</div>`}
    </div>`;
  }
}

        <th class="num">Ціна за одиницю, грн</th><th class="num">Сума, грн</th>${canEdit?"<th></th>":""}</tr></thead><tbody>

        <td class="name">${esc(a.name)}${a.note?`<div class="sub2">${esc(a.note)}</div>`:""}</td>
        <td class="mono sub2">${esc(a.nomen||"—")}</td>
        <td>${esc(a.unit)}</td>
        <td class="num" style="font-weight:600">${qty(a.qty)}</td>
        <td class="num">${money(a.price)}</td>
        <td class="num">${money(a.qty*(a.price||0))}</td>
        ${canEdit? `<td style="white-space:nowrap;text-align:right">

          <button class="btn sm danger" data-adel="${a.id}">Вилучити</button></td>`:""}

/* ---------- завантаження переліку з Excel ---------- */
function assetImportModal(loc){
  modal("Завантаження переліку майна", `
    <div class="drop" id="a-drop">
      <strong>Перетягніть файл Excel або натисніть, щоб вибрати</strong>
      <span>Підтримується .xlsx, .xls і .csv. Колонки: назва майна, номенклатурний номер, одиниця виміру, кількість, ціна за одиницю</span>
      <input type="file" id="a-file" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm" id="a-tpl">Завантажити шаблон</button>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)">
        <input type="checkbox" id="a-wipe" style="width:auto"> замінити наявний перелік повністю</label>
    </div>
    <div id="a-prev" style="margin-top:14px"></div>`,
    [{t:"Закрити", f:close}]);

  const drop = document.getElementById("a-drop"), file = document.getElementById("a-file");
  drop.onclick = ()=>file.click();
  drop.ondragover = e=>{e.preventDefault(); drop.classList.add("over");};
  drop.ondragleave = ()=>drop.classList.remove("over");
  drop.ondrop = e=>{e.preventDefault(); drop.classList.remove("over"); if(e.dataTransfer.files[0]) read(e.dataTransfer.files[0]);};
  file.onchange = e=>{ if(e.target.files[0]) read(e.target.files[0]); };
  document.getElementById("a-tpl").onclick = ()=>{
    const aoa = [
      ["Назва майна","Номенклатурний номер","Одиниця виміру","Кількість","Ціна за одиницю"],
      ["Ноші санітарні складані","9018.90.5","шт",4,3850],
      ["Сумка медична польова","4202.92.1","шт",2,1740]
    ];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Майно");
    XLSX.writeFile(wb, "shablon-mayna.xlsx");
  };

  function read(f){
    const fr = new FileReader();
    fr.onload = ev=>{
      try{
        const wb = XLSX.read(ev.target.result, {type:"array", cellDates:true});
        const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:true, defval:""});
        parse(aoa, f.name);
      }catch(err){ toast("Не вдалося прочитати файл: " + err.message, true); }
    };
    fr.readAsArrayBuffer(f);
  }
  function parse(aoa, fname){
    let hi = -1, map = null;
    for(let i=0;i<Math.min(aoa.length,15);i++){
      const m = mapCols(aoa[i]);
      if(m.name!=null && m.qty!=null){ hi=i; map=m; break; }
    }
    if(hi < 0){
      document.getElementById("a-prev").innerHTML = `<div class="empty"><strong>Не знайдено заголовки</strong>Потрібні щонайменше колонки «Назва майна» та «Кількість».</div>`;
      return;
    }
    const rows = [];
    for(let i=hi+1;i<aoa.length;i++){
      const r = aoa[i]; if(!r) continue;
      const name = String(r[map.name]||"").trim();
      if(!name) continue;
      const q = num(r[map.qty]); if(q <= 0) continue;
      rows.push({
        name,
        nomen: map.nomen!=null ? String(r[map.nomen]||"").trim() : "",
        unit:  map.unit!=null  ? (String(r[map.unit]||"").trim() || "шт") : "шт",
        qty: q,
        price: map.price!=null ? num(r[map.price]) : 0
      });
    }
    if(!rows.length){
      document.getElementById("a-prev").innerHTML = `<div class="empty"><strong>Рядків не знайдено</strong>Перевірте, що під заголовками є дані з кількістю більшою за нуль.</div>`;
      return;
    }
    const sum = rows.reduce((s,r)=>s+r.qty*r.price,0);
    document.getElementById("a-prev").innerHTML = `<div class="card"><header><h3>Перевірка: ${rows.length} позицій · ${money(sum)} грн</h3>
        <span class="spacer"></span><span class="eyebrow">${esc(fname)}</span></header>
      <div class="tw" style="max-height:280px"><table><thead><tr><th>Назва майна</th><th>Ном.</th><th>Од.</th>
        <th class="num">К-сть</th><th class="num">Ціна</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="mono sub2">${esc(r.nomen||"—")}</td><td>${esc(r.unit)}</td>
          <td class="num">${qty(r.qty)}</td><td class="num">${money(r.price)}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="pad"><button class="btn primary" id="a-commit">Внести ${rows.length} позицій</button></div></div>`;

    document.getElementById("a-commit").onclick = ()=>{
      const wipe = document.getElementById("a-wipe").checked;
      S.assets = S.assets || [];
      if(wipe){
        const n = assetsAt(loc).length;
        S.assets = S.assets.filter(a=>a.loc!==loc);
        if(n) log("Майно", `${LOCS[loc].name}: попередній перелік (${n} позицій) замінено новим`);
      }
      let added = 0, merged = 0;
      rows.forEach(r=>{
        const key = (r.nomen||"").toLowerCase();
        const ex = assetsAt(loc).find(a =>
          (key && (a.nomen||"").toLowerCase()===key) ||
          (!key && a.name.trim().toLowerCase()===r.name.toLowerCase()));
        if(ex){ ex.qty += r.qty; if(r.price) ex.price = r.price; merged++; }
        else { S.assets.push({id:uid("a"), loc, name:r.name, nomen:r.nomen, unit:r.unit, qty:r.qty, price:r.price, note:"", at:Date.now()}); added++; }
      });
      log("Майно", `${LOCS[loc].name}: завантажено перелік з файлу — нових позицій ${added}, доповнено ${merged}, на суму ${money(sum)} грн`);
      close(); toast(`Внесено: ${added} нових, ${merged} доповнено`); render();
    };
  }
}

function exportAssets(loc){
  const aoa = [["Підрозділ","Назва майна","Номенклатурний номер","Одиниця виміру","Кількість","Ціна за одиницю","Сума","Примітка"]];
  assetsAt(loc).sort((a,b)=>a.name.localeCompare(b.name,"uk")).forEach(a=>
    aoa.push([LOCS[loc].name, a.name, a.nomen, a.unit, a.qty, a.price, Math.round(a.qty*(a.price||0)*100)/100, a.note||""]));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Майно");
  XLSX.writeFile(wb, "mayno-" + LOCS[loc].short.toLowerCase() + "-" + new Date().toISOString().slice(0,10) + ".xlsx");
  log("Система", `Вивантажено перелік майна: ${LOCS[loc].name}`);

}

function exportUnit(loc){

  atLoc(loc).sort((a,b)=> item(a.itemId).name.localeCompare(item(b.itemId).name,"uk") || (dparse(a.expiry)||9e15)-(dparse(b.expiry)||9e15))

                Math.round(b.qty*b.price*100)/100, b.expiry?dstr(b.expiry):"", d===null?"":d, sh.label, b.src||""]);

  toast("Файл сформовано");
}

function viewReq(){
  const isDoc = LOCS[S.role].kind==="prescriber";

    act("Створити призначення", ()=>newRxModal(false)).classList.add("primary");

    cb.classList.add("danger"); cb.style.fontWeight = "600";
  }
  if(canOrder(S.role)){
    const rb = act("Створити заявку", newReqModal);
    if(!canRx) rb.classList.add("primary");
  }

  const pReq = pending(), pRx = rxPending();
  const doneReq = S.requests.filter(r=>r.status!=="pending").sort((a,b)=>(b.closed||0)-(a.closed||0));
  const doneRx  = (S.rx||[]).filter(r=>r.status!=="pending").sort((a,b)=>(b.closed||0)-(a.closed||0));

      <button data-s="rx" class="${sub.req==="rx"?"on":""}">Рецепти в очікуванні (${pRx.length})</button>
      <button data-s="hist" class="${sub.req==="hist"?"on":""}">Історія</button>
    </div></div><div id="rbody"></div>`);
  v.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{sub.req=b.dataset.s;render()});

  if(sub.req==="pending")   drawReq();
  else if(sub.req==="rx")   drawRx();
  else                      drawHist();

function statusTag(r){
  const m = {issued:["ok","Видано"], partial:["warn","Видано частково"], rejected:["crit","Відхилено"], cancelled:["","Скасовано"], pending:["acc","В очікуванні"]};
  const t = m[r.status] || ["","—"];
  return `<span class="tag ${t[0]}"><span class="dot"></span>${t[1]}</span>`;
}

/* ---------- швидкий пошук у переліку препаратів ---------- */
function attachPicker(findId, selId, rows, onPick){
  const inp = document.getElementById(findId), sel = document.getElementById(selId);
  const opts = rows.map(r => ({
    v: r.itemId,
    t: r.item.name + " — " + qty(r.qty) + " " + r.item.unit,
    s: (r.item.name + " " + (r.item.nomen || "")).toLowerCase()
  }));
  const draw = ()=>{
    const q = inp.value.trim().toLowerCase();
    const list = q ? opts.filter(o => o.s.indexOf(q) >= 0) : opts;
    const keep = sel.value;
    sel.innerHTML = list.length
      ? list.map(o => `<option value="${o.v}">${esc(o.t)}</option>`).join("")
      : `<option value="">за запитом нічого не знайдено</option>`;
    if(list.some(o => o.v === keep)) sel.value = keep;
    const c = document.getElementById(findId + "-cnt");
    if(c) c.textContent = q ? (list.length ? "знайдено: " + list.length : "нічого не знайдено")
                            : "усього позицій: " + opts.length;
    if(onPick) onPick(sel.value);
  };
  inp.oninput = draw;
  if(onPick) sel.addEventListener("change", ()=>onPick(sel.value));
  draw();
}

        <span class="spacer"></span><span class="eyebrow" id="rx-dxnow">не обрано</span></header>

      <div class="field" style="flex:1;min-width:250px"><label>Препарат (${cito ? "є на складі аптеки" : "наявний у частині"})</label>
        <select id="rx-pick"></select></div>
      <div class="field" style="width:130px"><label>Кількість</label><input type="number" id="rx-q" step="any" min="0" value="1"></div>

    </div>

    <div id="rx-lines"></div>
    <div class="field" style="margin-top:12px"><label>Коментар</label>
      <textarea id="rx-com" placeholder="Діагноз, спосіб застосування, тривалість курсу"></textarea></div>
    <p class="sub2" style="margin:10px 0 0">${cito
      ? "Списання відбувається одразу зі складу аптеки, поза ланцюгом постів."
      : "Списання йде за ланцюгом: спершу пост медсестри, далі старша медсестра, і лише потім склад аптеки."}</p>`,
    [{t:"Скасувати", f:close},{t:cito?"Виписати Cito!":"Створити призначення", cls:"primary", f:submit}]);

  attachPicker("rx-find", "rx-pick", rows, id => {
    const w = document.getElementById("rx-alt");
    if(w) w.innerHTML = id ? analogHTML(id, chain) : "";
  });
  loadMkh4().then(()=>{ if(document.getElementById("rx-detwrap")) renderDetail(); });

  /* --- вибір діагнозу --- */
  const clsSel = document.getElementById("rx-cls"), blkSel = document.getElementById("rx-blk");
  clsSel.innerHTML = `<option value="">— оберіть клас —</option>` +
    MKH10.map(c=>`<option value="${c.c}">${c.c}. ${esc(c.n)} (${c.r})</option>`).join("");
  function fillBlocks(cls, pick){
    const c = MKH10.find(x=>x.c===cls);
    blkSel.innerHTML = c
      ? `<option value="">— оберіть блок —</option>` + c.b.map(b=>`<option value="${b[0]}" ${pick===b[0]?"selected":""}>${b[0]} · ${esc(b[1])}</option>`).join("")
      : `<option value="">спершу оберіть клас</option>`;
  }
  function fillSubs(pick){
    const w = document.getElementById("rx-subwrap"), block = blkSel.value;
    if(!block){ w.innerHTML = `<input type="text" disabled placeholder="спершу оберіть блок">`; return; }
    if(hasSubs(block)){
      w.innerHTML = `<select id="rx-sub"><option value="">— без уточнення до коду —</option>` +
        MKH3[block].map(sc=>`<option value="${sc[0]}" ${pick===sc[0]?"selected":""}>${sc[0]} · ${esc(sc[1])}</option>`).join("") + `</select>`;
      document.getElementById("rx-sub").onchange = ()=>{ detChain = []; renderDetail(); showDx(); };
    }else{
      w.innerHTML = `<input type="text" id="rx-subman" placeholder="код у межах ${block}, напр. ${block.split("-")[0]}" value="${pick||""}">
        <span class="sub2">Для цього блоку перелік рубрик відсутній — за потреби впишіть код вручну.</span>`;
      document.getElementById("rx-subman").oninput = showDx;
    }
    renderDetail();
    showDx();
  }
  let detChain = [];
  function detInfo(){
    let parent = null;
    const sel = document.getElementById("rx-sub");
    parent = sel && sel.value ? sel.value : null;
    let last = null;
    for(let i = 0; i < detChain.length; i++){
      if(!parent || !detChain[i] || !MKH4 || !MKH4[parent]) break;
      const it = MKH4[parent].find(x => x[0] === detChain[i]);
      if(!it) break;
      last = {code:it[0], name:it[1]};
      parent = it[0];
    }
    return last;
  }
  function renderDetail(){
    const w = document.getElementById("rx-detwrap");
    const sel = document.getElementById("rx-sub");
    const base = sel && sel.value ? sel.value : null;
    if(!base){ w.innerHTML = ""; return; }
    if(mkh4State === "loading"){ w.innerHTML = `<p class="sub2" style="margin:8px 0 0">Завантажую деталізацію…</p>`; return; }
    if(mkh4State !== "ready" || !MKH4[base]){ w.innerHTML = ""; return; }
    let html = "", cur = base, lvl = 0;
    while(MKH4[cur] && lvl < 2){
      const chosen = detChain[lvl] && MKH4[cur].some(x => x[0] === detChain[lvl]) ? detChain[lvl] : "";
      html += `<div class="field" style="margin-top:10px"><label>${lvl === 0 ? "Деталізація — 4-й знак" : "Уточнення — 5-й знак"}</label>
        <select data-det="${lvl}"><option value="">— без деталізації —</option>` +
        MKH4[cur].map(x => `<option value="${x[0]}" ${chosen === x[0] ? "selected" : ""}>${x[0]} · ${esc(x[1])}</option>`).join("") +
        `</select></div>`;
      if(!chosen) break;
      cur = chosen; lvl++;
    }
    w.innerHTML = html;
    w.querySelectorAll("[data-det]").forEach(sl => sl.onchange = ()=>{
      const i = +sl.dataset.det;
      detChain = detChain.slice(0, i);
      if(sl.value) detChain[i] = sl.value;
      renderDetail(); showDx();
    });
  }
  function currentDx(){
    if(!blkSel.value) return null;
    const d = dxFind(blkSel.value);
    const sel = document.getElementById("rx-sub"), man = document.getElementById("rx-subman");
    if(sel && sel.value){
      const sc = MKH3[blkSel.value].find(x=>x[0]===sel.value);
      const base = Object.assign({}, d, {sub:sc[0], subName:sc[1]});
      const det = detInfo();
      return det ? Object.assign(base, {det:det.code, detName:det.name}) : base;
    }
    if(man && man.value.trim()){
      const code = man.value.trim().toUpperCase();
      if(!inBlock(code, blkSel.value)) return Object.assign({}, d, {badSub:code});
      return Object.assign({}, d, {sub:code, subName:""});
    }
    return d;
  }
  function showDx(){
    const d = currentDx();
    const el = document.getElementById("rx-dxnow");
    el.textContent = !d ? "не обрано"
      : d.badSub ? "код " + d.badSub + " не належить блоку " + d.code
      : dxLabel(d);
    el.style.color = d && d.badSub ? "var(--crit)" : "";
  }
  fillBlocks("", null);
  clsSel.onchange = ()=>{ fillBlocks(clsSel.value, null); fillSubs(null); };
  blkSel.onchange = ()=>{ fillSubs(null); };
  fillSubs(null);

  const dxq = document.getElementById("rx-dxq"), dxres = document.getElementById("rx-dxres");

    const found = dxSearch(dxq.value);

            <span class="mono" style="color:var(--accent)">${f.det||f.sub||f.code}</span> ${esc(f.det?f.detName:(f.sub?f.subName:f.name))}
            <span class="sub2"> — ${f.det?"рубрика "+f.sub:(f.sub?"блок "+f.code:"клас "+f.cls)}</span></button>`).join("")}
        </div>`
      : (dxq.value.trim().length >= 2 ? `<p class="sub2" style="margin:0 0 12px">За цим запитом нічого не знайдено — скористайтесь переліком нижче.</p>` : "");
    dxres.querySelectorAll("[data-dx]").forEach(b=>b.onclick=()=>{
      const d = dxFind(b.dataset.dx);
      clsSel.value = d.cls; fillBlocks(d.cls, d.code);
      const dv = b.dataset.det;                       // код 5-го рівня тягне за собою 4-й
      detChain = dv ? (dv.length > 5 ? [dv.slice(0, 5), dv] : [dv]) : [];
      fillSubs(b.dataset.sub || null);
      dxq.value = ""; dxres.innerHTML = "";
    });
  };

  const draw = ()=>{
    $("#rx-lines").innerHTML = lines.length ? `<table class="lines"><thead><tr><th>Препарат</th><th class="num">Кількість</th><th class="num">Є в наявності</th><th></th></tr></thead><tbody>
      ${lines.map((l,i)=>{const it=item(l.itemId); const has=rxAvail(l.itemId, chain); return `<tr>
        <td>${esc(it.name)}<div class="sub2">${esc(haveLabel(l.itemId, chain))}</div></td>
        <td class="num">${qty(l.want)} ${esc(it.unit)}</td>

        <td style="text-align:right"><button class="btn sm danger" data-del="${i}">Прибрати</button></td></tr>`}).join("")}
